<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Archived projects</title>
<style>
:root {
  --bg: #fafafa; --surface: #fff; --hover: #f2f2f3; --sel: #ebebee;
  --border: #e7e7ea; --border-strong: #d4d4d8; --text: #18181b; --muted: #71717a; --faint: #a1a1aa;
  --accent: #5b5bd6; --accent-bg: #ededfc; --warn: #b7791f;
  --font: Inter, system-ui, sans-serif; --mono: ui-monospace, 'JetBrains Mono', monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0d0d10; --surface: #131317; --hover: #1c1c22; --sel: #24242c;
    --border: #25252c; --border-strong: #33333c; --text: #ececf0; --muted: #8d8d98; --faint: #5c5c66;
    --accent: #8b8bf5; --accent-bg: #25254a; --warn: #e0a84a; color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0d0d10; --surface: #131317; --hover: #1c1c22; --sel: #24242c;
  --border: #25252c; --border-strong: #33333c; --text: #ececf0; --muted: #8d8d98; --faint: #5c5c66;
  --accent: #8b8bf5; --accent-bg: #25254a; --warn: #e0a84a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.5 var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
.top { display: flex; align-items: center; gap: 2px; padding: 0 12px; height: 44px; border-bottom: 1px solid var(--border); background: var(--surface); overflow-x: auto; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-right: 14px; white-space: nowrap; }
.logo b { width: 20px; height: 20px; border-radius: 6px; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 10px; }
.tab { border: 0; background: none; padding: 6px 10px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
.tab.on { color: var(--text); background: var(--sel); }
.spacer { flex: 1; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: calc(100vh - 44px); }
.left { padding: 22px 24px; border-right: 1px solid var(--border); min-width: 0; }
.right { padding: 22px 24px; min-width: 0; }
.head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
h1 { font-size: 18px; font-weight: 600; margin: 0; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .mono { font-family: var(--mono); }
.row { display: flex; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.toolbar { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; flex: none; }
.seg button { border: 0; background: var(--surface); padding: 3px 10px; cursor: pointer; color: var(--muted); font-size: 12px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--sel); color: var(--text); }
.count { font: 500 11px var(--mono); color: var(--faint); margin-left: 4px; }
.search { flex: 1; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 3px 8px; }
.search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; }
.kbd { font: 500 11px var(--mono); padding: 1px 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); }
.list { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
.r { display: grid; grid-template-columns: 3px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 12px 8px 0; border-top: 1px solid var(--border); cursor: pointer; }
.r:first-child { border-top: 0; }
.r:hover { background: var(--hover); }
.r.sel { background: var(--sel); }
.r.archived .name { color: var(--muted); }
.stripe { align-self: stretch; }
.name { font-weight: 500; }
.empty { color: var(--muted); padding: 18px 14px; text-align: center; }
.banner { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--sel); color: var(--muted); margin: 0 0 14px; }
.field { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 8px; padding: 3px 0; }
.field > span { color: var(--muted); }
.inp { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 5px 8px; outline: 0; }
.notes { margin-top: 22px; border: 1px dashed var(--border-strong); border-radius: 8px; padding: 12px 16px; color: var(--muted); }
.notes h3 { margin: 0 0 6px; font-size: 12px; color: var(--text); }
.notes li { margin: 3px 0; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 7px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr); } .left { border-right: 0; } }
</style>
</head>
<body>
<div class="top">
  <div class="logo"><b>CS</b><span>Chief of Staff</span></div>
  <span class="tab">Today</span><span class="tab">Tasks</span><span class="tab">Review</span><span class="tab">Waiting</span>
  <span class="tab on">Projects</span><span class="tab">People</span>
  <div class="spacer"></div>
  <button class="btn" id="theme" style="border-color:transparent">◐ Theme</button>
</div>
<div class="split">
  <div class="left" id="left"></div>
  <div class="right" id="right"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id)
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('on'), 1700) }
const projects = [
  { id: 1, name: 'Partner portal', color: '#378ADD', overview: 'New dealer and partner portal.', status: 'active', open: 3 },
  { id: 2, name: 'Pricing refresh', color: '#D85A30', overview: 'Dealer pricing tiers for 2027.', status: 'on_hold', open: 2 },
  { id: 3, name: 'Dealer training', color: '#1D9E75', overview: 'Online certification for dealers.', status: 'completed', open: 0 },
  { id: 4, name: 'Firmware 3.1 launch', color: '#D4537E', overview: 'Spring firmware release and dealer notes.', status: 'archived', open: 0 },
  { id: 5, name: 'CES 2026 booth', color: '#639922', overview: 'Booth demos and talking points for CES.', status: 'archived', open: 1 },
]
const LABEL = { active: 'Active', on_hold: 'On hold', completed: 'Completed', archived: 'Archived' }
let mode = 'active', sel = 1, q = ''

function render() {
  const inMode = projects.filter((p) => (mode === 'archived') === (p.status === 'archived'))
  const shown = inMode.filter((p) => !q || (p.name + p.overview).toLowerCase().includes(q.toLowerCase()))
  const nArch = projects.filter((p) => p.status === 'archived').length
  const nAct = projects.length - nArch
  $('left').innerHTML = `
    <div class="head"><h1>Projects</h1><span class="muted">${mode === 'archived' ? `${nArch} archived` : nAct}</span><div class="spacer"></div><button class="btn primary">New project</button></div>
    <div class="toolbar">
      <div class="seg"><button data-mode="active" class="${mode === 'active' ? 'on' : ''}">Active</button><button data-mode="archived" class="${mode === 'archived' ? 'on' : ''}">Archived<span class="count">${nArch}</span></button></div>
      <label class="search"><span class="faint">⌕</span><input id="q" value="${q}" placeholder="Search projects"><span class="kbd">/</span></label>
    </div>
    <div class="list">${shown.map((p) => `<div class="r ${p.status === 'archived' ? 'archived' : ''} ${sel === p.id ? 'sel' : ''}" data-id="${p.id}"><div class="stripe" style="background:${p.color}"></div><div style="min-width:0"><div class="name">${p.name}</div><div class="faint" style="font-size:11px">${p.overview}</div></div><span class="faint" style="font-size:12px">${p.status === 'active' || p.status === 'archived' ? '' : LABEL[p.status]}</span><span class="mono muted" title="Open tasks">${p.open}</span></div>`).join('') || `<div class="empty">${q ? `Nothing matches “${q}”` : mode === 'archived' ? 'No archived projects. Set a project’s status to Archived to tuck it away here.' : 'No active projects.'}</div>`}</div>
    <div class="notes"><h3>Mockup notes (not part of the app)</h3><ul>
      <li><b>Active / Archived</b> sits where Open / Done is on Tasks. Active is everything not archived (active, on hold, completed), as today. The count shows how many are archived.</li>
      <li>Archived projects still stay out of the Tasks project filters, the task editor’s project list, and what the AI reads on imports.</li>
      <li>Selecting an archived project opens its page as usual (overview, brief, History, open tasks), with a note at the top and an <b>Unarchive</b> button.</li>
      <li>Unarchive sets it back to Active and returns it to the Active list. Changing Status in the form works too.</li>
      <li>Search works in either list.</li>
    </ul></div>`
  const p = projects.find((x) => x.id === sel)
  $('right').innerHTML = !p || (mode === 'archived') !== (p.status === 'archived')
    ? `<div class="empty" style="margin-top:30vh">Select a project</div>`
    : `${p.status === 'archived' ? `<div class="banner"><span>Archived: hidden from Tasks filters, the task editor and the AI.</span><div class="spacer"></div><button class="btn" id="unarchive">Unarchive</button></div>` : ''}
      <div style="height:3px;border-radius:2px;background:${p.color};margin-bottom:10px"></div>
      <div style="font-size:20px;font-weight:600">${p.name}</div>
      <div class="muted" style="margin:2px 0 12px">${p.overview}</div>
      <div class="field"><span>Status</span><select class="inp" id="status" style="width:auto">${Object.entries(LABEL).map(([k, v]) => `<option value="${k}" ${p.status === k ? 'selected' : ''}>${v === 'Archived' ? 'Archived (hidden)' : v}</option>`).join('')}</select></div>
      <div class="faint" style="margin-top:20px">(Brief, History, standing instructions and open tasks, unchanged)</div>`
  $('q').oninput = (e) => { q = e.target.value; const pos = e.target.selectionStart; render(); $('q').focus(); $('q').setSelectionRange(pos, pos) }
  if ($('unarchive')) $('unarchive').onclick = () => { p.status = 'active'; mode = 'active'; toast(`${p.name} is active again`); render() }
  if ($('status')) $('status').onchange = (e) => { p.status = e.target.value; toast(p.status === 'archived' ? `${p.name} archived` : 'Saved'); if ((mode === 'archived') !== (p.status === 'archived')) sel = null; render() }
}
document.addEventListener('click', (e) => {
  const m = e.target.closest('[data-mode]'); if (m) { mode = m.dataset.mode; sel = projects.find((p) => (mode === 'archived') === (p.status === 'archived'))?.id ?? null; render(); return }
  const r = e.target.closest('[data-id]'); if (r) { sel = Number(r.dataset.id); render() }
})
$('theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark' }
render()
</script>
</body>
</html>
