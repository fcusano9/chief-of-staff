<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shortcut bar</title>
<style>
:root {
  --bg: #fafafa; --surface: #fff; --hover: #f2f2f3; --sel: #ebebee;
  --border: #e7e7ea; --border-strong: #d4d4d8; --text: #18181b; --muted: #71717a; --faint: #a1a1aa;
  --accent: #5b5bd6; --accent-bg: #ededfc; --k-task: #5b5bd6;
  --font: Inter, system-ui, sans-serif; --mono: ui-monospace, 'JetBrains Mono', monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0d0d10; --surface: #131317; --hover: #1c1c22; --sel: #24242c;
    --border: #25252c; --border-strong: #33333c; --text: #ececf0; --muted: #8d8d98; --faint: #5c5c66;
    --accent: #8b8bf5; --accent-bg: #25254a; --k-task: #8b8bf5; color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0d0d10; --surface: #131317; --hover: #1c1c22; --sel: #24242c;
  --border: #25252c; --border-strong: #33333c; --text: #ececf0; --muted: #8d8d98; --faint: #5c5c66;
  --accent: #8b8bf5; --accent-bg: #25254a; --k-task: #8b8bf5; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.5 var(--font); background: var(--bg); color: var(--text); display: grid; grid-template-rows: 44px minmax(0, 1fr) 28px; }
button { font: inherit; color: inherit; }
.top { display: flex; align-items: center; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--surface); overflow-x: auto; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-right: 14px; white-space: nowrap; }
.logo b { width: 20px; height: 20px; border-radius: 6px; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 10px; }
.tab { border: 0; background: none; padding: 6px 10px; border-radius: 6px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab.on { color: var(--text); background: var(--sel); }
.spacer { flex: 1; }
main { overflow: auto; }
.page { max-width: 900px; margin: 0 auto; padding: 22px 28px 40px; }
h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.row { display: flex; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.btn.ghost { border-color: transparent; background: none; }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.kbd { font: 500 11px var(--mono); padding: 1px 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--surface); white-space: nowrap; }
.list { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
.r { display: grid; grid-template-columns: 100px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border-top: 1px solid var(--border); }
.r:first-child { border-top: 0; }
.r.sel { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: color-mix(in srgb, var(--k-task) 14%, transparent); color: var(--k-task); }
.inp { border: 1px solid var(--accent); background: var(--bg); border-radius: 6px; padding: 5px 8px; width: 100%; outline: 0; font: inherit; color: inherit; }
.statusbar { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-top: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; }
.statusbar .sep { width: 1px; height: 14px; background: var(--border-strong); }
.hl { animation: hl 0.6s; } @keyframes hl { from { background: var(--accent-bg); } }
.notes { margin-top: 24px; border: 1px dashed var(--border-strong); border-radius: 8px; padding: 12px 16px; color: var(--muted); }
.notes h3 { margin: 0 0 6px; font-size: 12px; color: var(--text); } .notes li { margin: 3px 0; }
.compare { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="top">
  <div class="logo"><b>CS</b><span>Chief of Staff</span></div>
  <span id="tabs" class="row" style="gap:2px"></span>
  <div class="spacer"></div>
  <button class="btn ghost" id="theme">◐ Theme</button>
</div>
<main><div class="page" id="page"></div></main>
<footer class="statusbar" id="bar"></footer>

<script>
const ALWAYS = [['Ctrl K', 'commands'], ['G', 'go to']]
const PAGES = {
  Today: { hints: [['N', 'new task'], ['G R', 'review']] },
  Tasks: {
    hints: [['↑ ↓', 'move'], ['↵', 'open'], ['E', 'done'], ['N', 'new'], ['/', 'search']],
    editing: { label: 'A task is open', hints: [['Ctrl ↵', 'save'], ['E', 'done'], ['Esc', 'close']] },
  },
  Review: {
    hints: [['↑ ↓', 'move'], ['A', 'accept'], ['R', 'reject'], ['↵', 'edit']],
    editing: { label: 'Editing a suggestion', hints: [['Ctrl ↵', 'accept'], ['Esc', 'cancel']] },
  },
  Waiting: { hints: [['↑ ↓', 'move'], ['↵', 'open'], ['E', 'done'], ['N', 'new'], ['/', 'search']] },
  Projects: {
    hints: [['↑ ↓', 'move'], ['↵', 'edit name'], ['/', 'search'], ['N', 'new task']],
    editing: { label: 'Editing the brief or overview', hints: [['Ctrl ↵', 'save'], ['Esc', 'cancel']] },
  },
  People: {
    hints: [['↑ ↓', 'move'], ['↵', 'edit name'], ['/', 'search'], ['N', 'new task']],
    editing: { label: 'Editing the brief', hints: [['Ctrl ↵', 'save'], ['Esc', 'cancel']] },
  },
  Import: { hints: [['Ctrl ↵', 'extract'], ['N', 'new task']] },
  Settings: { hints: [['N', 'new task']] },
}
let page = 'Review', editing = false

const keys = (k) => k.split(' ').map((x) => `<span class="kbd">${x}</span>`).join(' ')
function renderBar() {
  const p = PAGES[page]
  const hints = editing && p.editing ? p.editing.hints : [...p.hints]
  const left = [...ALWAYS, ...hints].map(([k, l]) => `<span>${keys(k)} ${l}</span>`).join('')
  const bar = document.getElementById('bar')
  bar.innerHTML = `${left}<div class="spacer"></div><span>Backed up Nov 3, 9:12 AM</span><span>AI · Demo AI (on this PC)</span>`
  bar.classList.remove('hl'); void bar.offsetWidth; bar.classList.add('hl')
}
function renderTabs() {
  document.getElementById('tabs').innerHTML = Object.keys(PAGES).map((t) => `<button class="tab ${t === page ? 'on' : ''}" data-t="${t}">${t}</button>`).join('')
}
function renderPage() {
  const p = PAGES[page]
  const toggle = p.editing ? `<button class="btn" id="edit">${editing ? 'Stop editing' : `Show: ${p.editing.label.toLowerCase()}`}</button>` : ''
  const review = page === 'Review' ? `
    <div class="list" style="margin-top:12px">
      <div class="r sel"><span class="chip">New task</span>
        <div>${editing ? '<input class="inp" value="Send the updated pricing deck to EMEA distributors" />' : '<b style="font-weight:500">Send the updated pricing deck to EMEA distributors</b><div class="muted" style="font-size:12px">Due Fri</div>'}</div>
        <div class="row" style="gap:4px"><button class="btn">Accept</button>${editing ? '<button class="btn ghost">Cancel</button>' : '<button class="btn ghost">Edit</button>'}<button class="btn ghost">Reject</button></div>
      </div>
      <div class="r"><span class="chip">Waiting on</span><div><b style="font-weight:500">Margin model for new tiers</b><div class="muted" style="font-size:12px">Waiting on Finance</div></div>
        <div class="row" style="gap:4px"><button class="btn">Accept</button><button class="btn ghost">Edit</button><button class="btn ghost">Reject</button></div></div>
    </div>
    <div class="compare"><span class="faint" style="font-size:12px">Buttons today:</span><span class="row" style="gap:4px"><button class="btn">Accept <span class="kbd">A</span></button><button class="btn ghost">Edit <span class="kbd">↵</span></button><button class="btn ghost">Reject <span class="kbd">R</span></button></span>
    <span class="faint" style="font-size:12px">Buttons after:</span><span class="row" style="gap:4px"><button class="btn">Accept</button><button class="btn ghost">Edit</button><button class="btn ghost">Reject</button></span></div>` : ''
  document.getElementById('page').innerHTML = `
    <h1>${page}</h1>
    <div class="row">${toggle}<span class="muted">Watch the bar at the bottom change.</span></div>
    ${review}
    <div class="notes"><h3>Mockup notes (not part of the app)</h3><ul>
      <li><b>Buttons lose their key labels</b> everywhere: Review (Accept, Edit, Reject, Cancel), New task on Today and Tasks, Mark done and Save in the task editor, Save and Cancel in the Projects and People brief editors and the History window, and Extract on Import.</li>
      <li><b>The bottom bar shows the keys for the page you're on</b>, after Ctrl K and G, which work everywhere. While you edit something (a suggestion, a brief, an open task), it switches to that editor's keys: Ctrl ↵ and Esc.</li>
      <li><b>Unchanged:</b> the Ctrl K label in the top search box, the / in list search boxes, the keys listed in the command palette, and the full list in Settings.</li>
      <li>Click the tabs above and the "Show" button to see each page's bar.</li>
    </ul></div>`
  const b = document.getElementById('edit')
  if (b) b.onclick = () => { editing = !editing; render() }
}
function render() { renderTabs(); renderPage(); renderBar() }
document.getElementById('tabs').addEventListener('click', (e) => { const t = e.target.closest('[data-t]'); if (t) { page = t.dataset.t; editing = false; render() } })
document.getElementById('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'
}
render()
</script>
</body>
</html>
