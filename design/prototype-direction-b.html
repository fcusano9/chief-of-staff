<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Chief of Staff · Direction B prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--surface:#fff;--raised:#fff;--hover:#f2f2f3;--sel:#ebebee;--border:#e7e7ea;--border-strong:#d4d4d8;--text:#18181b;--muted:#71717a;--faint:#a1a1aa;--accent:#5b5bd6;--accent-bg:#ededfc;--danger:#d93a3a;--warn:#b7791f;--ok:#2f855a;--scrim:rgba(24,24,27,.35);--shadow:0 16px 48px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06)}
[data-theme=dark]{--bg:#0d0d10;--surface:#131317;--raised:#1a1a1f;--hover:#1c1c22;--sel:#24242c;--border:#25252c;--border-strong:#33333c;--text:#ececf0;--muted:#8d8d98;--faint:#5c5c66;--accent:#8b8bf5;--accent-bg:#25254a;--danger:#f26d6d;--warn:#e0a84a;--ok:#5cc28c;--scrim:rgba(0,0,0,.55);--shadow:0 16px 48px rgba(0,0,0,.6)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.kbd{font:500 11px "JetBrains Mono",monospace;padding:1px 5px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--surface)}
.app{display:grid;grid-template-rows:44px minmax(0,1fr) 30px;grid-template-columns:minmax(0,1fr);height:100vh}
.top{display:flex;align-items:center;gap:2px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.logo{white-space:nowrap;font-weight:600;letter-spacing:-.01em;margin-right:14px;display:flex;align-items:center;gap:8px}
.logo b{width:20px;height:20px;border-radius:6px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:11px}
.tab{white-space:nowrap;border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
.tab:hover{background:var(--hover);color:var(--text)}.tab.on{color:var(--text);background:var(--sel)}
.count{font:500 11px "JetBrains Mono",monospace;background:var(--accent-bg);color:var(--accent);padding:0 5px;border-radius:4px}
.spacer{flex:1}
#tabs{min-width:0;overflow:hidden}
@media (max-width:1100px){.search .stext{display:none}.search{width:auto}.logo span{display:none}.why{display:none}}
.page .grid>*{min-width:0}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:4px 8px 4px 10px;width:240px;flex:none;white-space:nowrap;color:var(--faint);cursor:pointer}
.iconbtn{border:0;background:none;width:30px;height:30px;border-radius:6px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.iconbtn:hover{background:var(--hover);color:var(--text)}
main{overflow:auto}
.page{max-width:1080px;margin:0 auto;padding:22px 28px 40px}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
h1{font-size:18px;font-weight:600;letter-spacing:-.015em;margin:0}
h2{font-size:12px;font-weight:500;color:var(--muted);margin:22px 0 6px;text-transform:none}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--hover)}.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--hover)}
.list{border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden}
.r{display:grid;grid-template-columns:3px 30px minmax(0,1fr) auto 70px;gap:10px;align-items:center;padding:7px 12px 7px 0;border-top:1px solid var(--border);cursor:pointer}
.r:first-child{border-top:0}.r:hover{background:var(--hover)}.r.cur{background:var(--sel)}
.stripe{height:20px;border-radius:0 2px 2px 0}
.score{font:500 12px "JetBrains Mono",monospace;text-align:right}
.s-hi{color:var(--danger)}.s-mid{color:var(--warn)}.s-lo{color:var(--muted)}
.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why{color:var(--faint);font-size:12px;margin-left:8px}
.chip{font-size:11px;padding:1px 7px;border-radius:4px;white-space:nowrap}
.due{color:var(--muted);text-align:right;font-size:12px}.due.over{color:var(--danger)}
.grid{display:grid;gap:12px}
.card{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:12px 14px}
.stat{font:500 20px "JetBrains Mono",monospace}
.label{font-size:12px;color:var(--muted)}
.statusbar{display:flex;align-items:center;gap:14px;padding:0 14px;border-top:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px}
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;padding-top:9vh;z-index:10}
.scrim.open{display:flex}
.palette{width:580px;background:var(--raised);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--border);background:none;padding:14px 16px;font-size:15px;outline:0}
.pi{display:flex;align-items:center;gap:10px;padding:7px 16px;cursor:pointer}.pi.cur{background:var(--sel)}
.pg{font-size:11px;color:var(--faint);padding:8px 16px 2px}
.split2{--min:360px;display:grid;grid-template-columns:minmax(var(--min),var(--left,50%)) 7px minmax(var(--min),1fr);height:100%}
.pane{overflow:auto;min-width:0}.pane.left{padding:22px 18px 40px 28px}
.pane.right{background:var(--surface);container-type:inline-size}
.divider{cursor:col-resize;position:relative;outline:0;touch-action:none}
.divider::before{content:"";position:absolute;inset:0 3px;background:var(--border)}
.divider:hover::before,.divider:focus-visible::before,.divider.drag::before{inset:0 2px;background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px}
@container (max-width:620px){.dgrid{grid-template-columns:minmax(0,1fr)}.dgrid .meta{order:-1}}
.r.sel{background:var(--sel);box-shadow:inset 2px 0 0 var(--accent)}
.field{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;padding:3px 0}
.field>span{color:var(--muted)}
.inp{border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:5px 8px;width:100%;outline:0}
.inp:focus{border-color:var(--accent)}
.ai{border:1px solid var(--accent-bg);background:color-mix(in srgb,var(--accent-bg) 45%,transparent);border-radius:8px;padding:10px 12px}
.check{display:flex;gap:8px;align-items:center;padding:3px 0}
.box{width:14px;height:14px;border:1.5px solid var(--border-strong);border-radius:4px;display:grid;place-items:center;font-size:10px}
.box.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
.toast{position:fixed;bottom:42px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:7px 14px;border-radius:7px;font-size:12px;display:none;z-index:20}
.note{background:var(--accent-bg);color:var(--accent);font-size:11px;padding:2px 8px;border-radius:4px}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><b>CS</b><span>Chief of Staff</span></div>
    <nav id="tabs" style="display:flex;gap:2px"></nav>
    <div class="spacer"></div>
    <div class="search" onclick="openPalette()"><span>⌕</span><span class="stext" style="flex:1">Search or jump to…</span><span class="kbd">Ctrl K</span></div>
    <button class="iconbtn" title="New task (N)" onclick="openTask(null)">＋</button>
    <button class="iconbtn" title="Toggle theme (Shift+D)" onclick="toggleTheme()" id="themeBtn">◐</button>
    <button class="iconbtn" title="Settings" onclick="go('settings')">⚙</button>
  </header>
  <main id="main"></main>
  <footer class="statusbar" id="status"></footer>
</div>
<div class="scrim" id="paletteScrim" onclick="if(event.target===this)closeAll()"><div class="palette"><input id="pq" placeholder="Type a command, task, project, or person…" autocomplete="off"><div id="pr" style="max-height:360px;overflow:auto;padding-bottom:6px"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const P={roadmap:{n:'Q1 roadmap',c:'#7F77DD',bg:'#EEEDFE',fg:'#3C3489'},pricing:{n:'Pricing refresh',c:'#1D9E75',bg:'#E1F5EE',fg:'#085041'},portal:{n:'Partner portal',c:'#D85A30',bg:'#FAECE7',fg:'#712B13'},launch:{n:'Spring launch',c:'#378ADD',bg:'#E6F1FB',fg:'#0C447C'}};
const PEOPLE=[{i:'DL',n:'Dana Lee',r:'VP, Product',w:5,c:'#7F77DD'},{i:'MO',n:'Marcus Ortiz',r:'Director, Engineering',w:4,c:'#378ADD'},{i:'PS',n:'Priya Shah',r:'Finance partner',w:3,c:'#1D9E75'},{i:'TB',n:'Tom Baker',r:'Channel sales',w:3,c:'#D85A30'},{i:'AK',n:'Amy Kim',r:'Marketing',w:2,c:'#D4537E'}];
const T=[
 {id:1,t:'Roadmap slides for VP review',p:'roadmap',s:92,due:'Today',why:'Due today · requested by Dana Lee',who:'Dana Lee',st:'In progress',subs:[['Timeline',1],['Pricing assumptions',0],['Risks slide',0]]},
 {id:2,t:'Reply to distributor pricing thread',p:'pricing',s:81,due:'Wait 4d',why:'2 follow-ups · idle 4 days',who:'Tom Baker',st:'Open',subs:[]},
 {id:3,t:'Approve partner portal wireframes',p:'portal',s:74,due:'Yesterday',over:1,why:'Overdue by 1 day',who:'Marcus Ortiz',st:'Open',subs:[['Review nav',1],['Comment on login flow',0]]},
 {id:4,t:'Submit expense report',p:null,s:64,due:'Fri',why:'Due in 4 days',who:null,st:'Open',subs:[]},
 {id:5,t:'Draft dealer FAQ for new pricing',p:'pricing',s:58,due:'Nov 9',why:'Due in 7 days · requested by Priya Shah',who:'Priya Shah',st:'Open',subs:[]},
 {id:6,t:'Spring launch messaging review',p:'launch',s:47,due:'Nov 14',why:'Due in 12 days',who:'Amy Kim',st:'Open',subs:[]},
 {id:7,t:'Renew design tool license',p:null,s:31,due:'—',why:'No deadline or urgency signals',who:null,st:'Open',subs:[]},
];
const MORE=['Update pricing calculator','Collect beta feedback','Book customer visits','Write portal release notes','Review competitor teardown','Prep quarterly business review','Clean up roadmap backlog','Draft partner newsletter blurb','Check localization strings','Plan launch webinar','Confirm trade show booth','Refresh product one-pager','Sync with support on top issues','Outline training deck','Archive old spec docs','Review warranty policy draft','Approve marketing photos','Respond to analyst inquiry','Update team OKRs','Schedule 1:1s for December','Review UX research readout','Check SKU naming with ops','Send thank-you notes to beta dealers','Draft holiday coverage plan','Read new security policy'].map((t,i)=>({id:100+i,t,p:[null,'pricing','launch','portal','roadmap'][i%5],s:45-i,due:['Nov '+(10+i),'—'][i%2],why:i%2?'No deadline or urgency signals':'Due in '+(8+i)+' days',who:null,st:'Open',subs:[]}));
const ALL=T.concat(MORE);
const WAIT=[{t:'Margin model for new tiers',who:'Priya Shah',p:'pricing',d:6},{t:'Firmware release date',who:'Marcus Ortiz',p:'roadmap',d:2},{t:'Co-marketing budget sign-off',who:'Amy Kim',p:'launch',d:9}];
const REVIEW=[
 {k:'New task',t:'Send pricing deck to EMEA distributors',src:'Copilot weekly summary · Oct 30',why:'"Frank to send the updated deck to EMEA by Friday"',p:'pricing'},
 {k:'Status update',t:'Roadmap slides: timeline section finished',src:'Teams chat with Dana Lee · Nov 1',why:'Dana confirmed the timeline looks right.',p:'roadmap'},
 {k:'Looks done',t:'Approve partner portal wireframes',src:'Email from Marcus Ortiz · Nov 2',why:'Marcus wrote "thanks for signing off".',p:'portal'},
 {k:'Brief update',t:'Pricing refresh: tiers changed from 3 to 4',src:'Meeting transcript · Pricing review · Oct 29',why:'Decision recorded at 14:22 in the transcript.',p:'pricing'},
];
const TABS=[['today','Today'],['tasks','Tasks'],['review','Review',REVIEW.length],['waiting','Waiting',WAIT.length],['projects','Projects'],['people','People'],['prep','Prep'],['weekly','Weekly'],['archive','Archive'],['import','Import']];
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let view='today',cur=0,rows=[],sel=null,leftPct=+(store.get('cos.split')||50);
const $=s=>document.querySelector(s);
const chip=k=>k?`<span class="chip" style="background:color-mix(in srgb,${P[k].c} 16%,transparent);color:color-mix(in srgb,${P[k].c} 65%,var(--text))">${P[k].n}</span>`:'<span></span>';
const sc=s=>s>=80?'s-hi':s>=60?'s-mid':'s-lo';
const row=x=>`<div class="r" data-id="${x.id}" onclick="openTask(${x.id})"><div class="stripe" style="background:${x.p?P[x.p].c:'var(--border-strong)'}"></div><div class="score ${sc(x.s)}">${x.s}</div><div class="title">${x.t}<span class="why">${x.why}</span></div>${chip(x.p)}<div class="due ${x.over?'over':''}">${x.due}</div></div>`;
const person=n=>PEOPLE.find(p=>p.n===n);
const av=p=>`<span class="av" style="background:${p.c}22;color:${p.c}">${p.i}</span>`;

const V={
today:()=>`<div class="head"><h1>Good morning, Frank</h1><span class="muted">Monday, November 2</span><div class="spacer"></div><button class="btn" onclick="toast('Briefing refreshed (AI arrives in milestone 2)')">↻ Refresh briefing</button></div>
<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">
 ${[['Urgent',3,'var(--danger)'],['Overdue',1,'var(--warn)'],['Waiting on',3,'var(--text)'],['Open',T.length,'var(--text)']].map(([l,n,c])=>`<div class="card"><div class="label">${l}</div><div class="stat" style="color:${c}">${n}</div></div>`).join('')}
</div>
<div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
 <div><h2 style="margin-top:0">Focus · highest priority first</h2><div class="list" id="rows">${T.slice(0,5).map(row).join('')}</div></div>
 <div class="grid" style="align-content:start">
  <div class="ai"><div style="display:flex;gap:6px;align-items:center;margin-bottom:4px"><span style="color:var(--accent)">✦</span><b style="font-weight:500">Briefing</b><span class="faint" style="font-size:11px">· 7:30 AM</span></div>
   <div style="line-height:1.6">Dana's roadmap slides are due today and two sections are still open. The distributor pricing thread has two unanswered follow-ups; a reply draft is waiting in Review. Marcus may have already approved the portal wireframes.</div>
   <div style="display:flex;gap:6px;margin-top:8px"><button class="btn" onclick="go('review')">Open review queue <span class="kbd">G R</span></button></div></div>
  <div class="card"><div class="label" style="margin-bottom:6px">Meetings today</div>
   ${[['10:00','Roadmap sync','4 open items'],['14:30','Pricing review','2 decisions pending']].map(m=>`<div style="display:flex;gap:10px;padding:3px 0"><span class="mono muted" style="width:44px">${m[0]}</span><span style="flex:1">${m[1]}</span><a href="#" onclick="go('prep');return false" style="color:var(--accent);text-decoration:none">Prep →</a></div>`).join('')}</div>
  <div class="card"><div class="label" style="margin-bottom:6px">Waiting on others</div>
   ${WAIT.map(w=>`<div style="display:flex;gap:10px;padding:3px 0"><span style="flex:1">${w.t}</span><span class="muted">${w.who.split(' ')[0]}</span><span class="mono ${w.d>5?'s-mid':'muted'}" style="width:28px;text-align:right">${w.d}d</span></div>`).join('')}</div>
 </div></div>`,
tasks:()=>`<div class="split2" id="split" style="--left:${leftPct}%">
<section class="pane left" id="leftPane"><div class="head"><h1>Tasks</h1><span class="muted">${T.length} open · by priority</span><div class="spacer"></div><button class="btn primary" onclick="openTask(null)">New task <span class="kbd" style="background:none;color:inherit;border-color:currentColor">N</span></button></div>
<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap"><span class="pill" style="color:var(--text);border-color:var(--border-strong)">All</span>${Object.keys(P).map(k=>`<span class="pill"><span class="dot" style="background:${P[k].c}"></span>${P[k].n}</span>`).join('')}<span class="pill">No project</span><span class="pill">Status: open ▾</span><span class="pill">Requester ▾</span></div>
<div class="list" id="rows">${T.concat(MORE).map(row).join('')}</div></section>
<div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panes" tabindex="0" title="Drag to resize · double-click for 50/50"></div>
<section class="pane right" id="detail">${detail()}</section></div>`,
review:()=>`<div class="head"><h1>Review queue</h1><span class="muted">${REVIEW.length} suggestions · nothing changes until you accept</span><div class="spacer"></div><button class="btn" onclick="toast('Accepted all (prototype)')">Accept all</button></div>
<div class="list" id="rows">${REVIEW.map((r,i)=>`<div class="r" style="grid-template-columns:3px 96px minmax(0,1fr) auto;padding:10px 12px 10px 0;align-items:start" data-id="r${i}"><div class="stripe" style="background:${P[r.p].c};height:100%"></div><div><span class="chip" style="background:var(--accent-bg);color:var(--accent)">${r.k}</span></div><div><div>${r.t}</div><div class="muted" style="font-size:12px;margin-top:2px">${r.why}</div><div class="faint" style="font-size:11px;margin-top:2px">From ${r.src}</div></div><div style="display:flex;gap:6px"><button class="btn" onclick="event.stopPropagation();toast('Accepted')">Accept <span class="kbd">A</span></button><button class="btn ghost" onclick="event.stopPropagation();toast('Opened for editing')">Edit</button><button class="btn ghost" onclick="event.stopPropagation();toast('Rejected')">Reject</button></div></div>`).join('')}</div>`,
waiting:()=>`<div class="head"><h1>Waiting on</h1><span class="muted">oldest first</span></div>
<div class="list" id="rows">${WAIT.sort((a,b)=>b.d-a.d).map((w,i)=>`<div class="r" style="grid-template-columns:3px 34px minmax(0,1fr) auto auto" data-id="w${i}"><div class="stripe" style="background:${P[w.p].c}"></div>${av(person(w.who))}<div class="title">${w.t}<span class="why">${w.who}</span></div><span class="mono ${w.d>5?'s-mid':'muted'}">${w.d} days</span><button class="btn ghost" onclick="event.stopPropagation();toast('Follow-up draft opened. It is never sent automatically.')">Draft follow-up</button></div>`).join('')}</div>`,
projects:()=>`<div class="head"><h1>Projects</h1><div class="spacer"></div><button class="btn">New project</button></div>
<div class="split"><div class="list">${Object.entries(P).map(([k,p],i)=>`<div class="r ${i==0?'cur':''}" style="grid-template-columns:3px minmax(0,1fr) auto;padding-left:0"><div class="stripe" style="background:${p.c}"></div><div>${p.n}</div><span class="muted mono">${T.filter(t=>t.p==k).length}</span></div>`).join('')}</div>
<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span class="dot" style="background:${P.roadmap.c};width:12px;height:12px"></span><h1 style="font-size:16px">Q1 roadmap</h1><span class="pill">Active</span><div class="spacer"></div><div style="display:flex;gap:4px">${Object.values(P).map(p=>`<span class="dot" style="background:${p.c};width:14px;height:14px"></span>`).join('')}</div></div>
<div class="label">Project brief · what the AI always knows</div><textarea class="inp" style="margin:4px 0 10px">Plan and present the Q1 product roadmap to the VP of Product. Focus areas: firmware cadence, partner portal, pricing alignment. Final review Nov 2.</textarea>
<div class="label">Standing instructions</div><textarea class="inp" style="margin:4px 0 12px;min-height:44px">Keep updates to 3 bullets. Always cc Marcus on engineering dates.</textarea>
<div class="label" style="margin-bottom:4px">Open tasks</div><div class="list">${T.filter(t=>t.p=='roadmap').map(row).join('')}</div></div></div>`,
people:()=>`<div class="head"><h1>People</h1><div class="spacer"></div><button class="btn">Add person</button></div>
<div class="split"><div class="list">${PEOPLE.map((p,i)=>`<div class="r ${i==0?'cur':''}" style="grid-template-columns:40px minmax(0,1fr) auto;padding-left:10px">${av(p)}<div>${p.n}<div class="faint" style="font-size:11px">${p.r}</div></div><span class="mono" style="color:var(--warn)">${'★'.repeat(p.w)}<span class="faint">${'★'.repeat(5-p.w)}</span></span></div>`).join('')}</div>
<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">${av(PEOPLE[0])}<div><h1 style="font-size:16px">Dana Lee</h1><div class="muted">VP, Product · dana.lee@example.com</div></div><div class="spacer"></div><span class="muted">Priority weight</span><span class="mono" style="color:var(--warn)">★★★★★</span></div>
<div class="label">Person brief</div><textarea class="inp" style="margin:4px 0 12px">Frank's VP. Prefers short decks with a one-line ask up front. Usually replies on Teams within an hour.</textarea>
<div class="label" style="margin-bottom:4px">Their open asks</div><div class="list">${T.filter(t=>t.who=='Dana Lee').map(row).join('')}</div></div></div>`,
prep:()=>`<div class="head"><h1>Meeting prep</h1><span class="muted">Roadmap sync · 10:00–10:45 · Teams</span></div>
<div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)"><div class="grid" style="align-content:start">
<div class="ai"><b style="font-weight:500"><span style="color:var(--accent)">✦</span> Suggested talking points</b><ol style="margin:6px 0 0 18px;padding:0;line-height:1.7"><li>Confirm the firmware release date with Marcus (waiting 2 days)</li><li>Show the finished timeline slide</li><li>Ask Dana about pricing assumptions before Friday</li></ol></div>
<div><h2 style="margin-top:0">Open items with attendees</h2><div class="list">${[T[0],T[2]].map(row).join('')}</div></div></div>
<div class="grid" style="align-content:start"><div class="card"><div class="label" style="margin-bottom:6px">Attendees</div>${[PEOPLE[0],PEOPLE[1]].map(p=>`<div style="display:flex;gap:8px;align-items:center;padding:3px 0">${av(p)}<span>${p.n}</span><span class="faint">${p.r}</span></div>`).join('')}</div>
<div class="card"><div class="label" style="margin-bottom:6px">Recent decisions</div><div style="line-height:1.7">Oct 29 · Tiers changed from 3 to 4<br>Oct 22 · Portal login moves to SSO</div></div></div></div>`,
weekly:()=>`<div class="head"><h1>Weekly review</h1><span class="muted">Oct 26 – Nov 1</span><div class="spacer"></div><button class="btn" onclick="toast('Copied')">Copy report</button><button class="btn" onclick="toast('Saved to Outlook Drafts. Not sent.')">Save to Outlook drafts</button></div>
<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">${[['Completed',9],['New',6],['Slipping',2]].map(([l,n])=>`<div class="card"><div class="label">${l}</div><div class="stat">${n}</div></div>`).join('')}</div>
<div class="card" style="line-height:1.7"><div class="label">Status report draft</div><b style="font-weight:500">Q1 roadmap</b> · timeline approved; pricing and risk slides due Monday.<br><b style="font-weight:500">Pricing refresh</b> · moved to 4 tiers; waiting on Finance for the margin model (6 days).<br><b style="font-weight:500">Partner portal</b> · wireframes reviewed; SSO login decided.</div>`,
archive:()=>`<div class="head"><h1>Ask your archive</h1><span class="muted">Answers cite their sources</span></div>
<div class="card" style="margin-bottom:10px"><div class="muted" style="font-size:12px">You asked</div>What did we decide about partner portal login last year?</div>
<div class="ai" style="line-height:1.7">On Oct 22 you agreed with Marcus that the portal login would move to company SSO, replacing separate partner passwords <a href="#" style="color:var(--accent)">[1]</a>. Dana asked for a fallback for partners without SSO, which is still open <a href="#" style="color:var(--accent)">[2]</a>.
<div class="faint" style="font-size:11px;margin-top:6px">[1] Meeting transcript · Portal design review · Oct 22 &nbsp; [2] Email from Dana Lee · Oct 24</div></div>
<div style="display:flex;gap:8px;margin-top:12px"><input class="inp" placeholder="Ask about anything you've worked on…"><button class="btn primary">Ask</button></div>`,
import:()=>`<div class="head"><h1>Import</h1><span class="muted">Everything lands in the review queue first</span></div>
<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">${[['Scan Outlook','Last 7 days · Inbox, Sent'],['Paste text','Copilot summary, Teams chat, notes'],['Drop files','.vtt .docx .txt transcripts']].map(([a,b])=>`<div class="card" style="cursor:pointer"><div style="font-weight:500">${a}</div><div class="muted" style="font-size:12px">${b}</div></div>`).join('')}</div>
<textarea class="inp" style="min-height:160px" placeholder="Paste your Copilot weekly summary here…"></textarea>
<div style="display:flex;gap:8px;margin-top:8px;align-items:center"><select class="inp" style="width:220px"><option>Copilot weekly summary</option><option>Teams chat</option><option>Meeting transcript</option></select><div class="spacer"></div><button class="btn primary" onclick="toast('4 suggestions added to Review')">Extract suggestions</button></div>`,
settings:()=>`<div class="head"><h1>Settings</h1></div>
<div class="grid" style="grid-template-columns:1fr 1fr">
<div class="card"><div style="font-weight:500;margin-bottom:8px">AI provider</div><div class="field"><span>Provider</span><select class="inp"><option>Claude (Anthropic)</option><option disabled>Microsoft 365 Copilot · needs IT approval</option></select></div><div class="field"><span>API key</span><input class="inp" type="password" placeholder="Stored in the system keychain"></div></div>
<div class="card"><div style="font-weight:500;margin-bottom:8px">Appearance</div><div class="field"><span>Theme</span><select class="inp" onchange="setTheme(this.value)"><option value="system">Follow system</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="field"><span>Density</span><select class="inp"><option>Compact</option><option>Comfortable</option></select></div></div>
<div class="card"><div style="font-weight:500;margin-bottom:8px">Priority weights</div>${[['Due date',8],['Who is asking',7],['Staleness',5]].map(([l,v])=>`<div class="field"><span>${l}</span><input type="range" min="0" max="10" value="${v}"></div>`).join('')}</div>
<div class="card"><div style="font-weight:500;margin-bottom:8px">Backup</div><div class="field"><span>Folder</span><input class="inp" value="OneDrive\\Chief of Staff Backups"></div><div class="field"><span>Keep</span><input class="inp" value="30" style="width:80px"></div><div class="muted" style="font-size:12px;margin-top:6px">Last backup today at 7:02 AM</div></div>
<div class="card" style="grid-column:1/-1"><div style="font-weight:500;margin-bottom:8px">Keyboard shortcuts</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px 18px">${[['Ctrl K','Command palette'],['N','New task'],['J / K','Move down / up'],['Enter','Open task'],['E','Mark done'],['W','Set waiting on'],['G then T','Go to Today'],['G then R','Go to Review'],['Shift D','Toggle theme']].map(([k,l])=>`<div style="display:flex;justify-content:space-between"><span>${l}</span><span>${k.split(' ').map(x=>`<span class="kbd">${x}</span>`).join(' ')}</span></div>`).join('')}</div></div></div>`
};

function render(){
 $('#tabs').innerHTML=TABS.map(([k,l,n],i)=>`<button class="tab ${view==k?'on':''}" onclick="go('${k}')" title="${i<9?'Alt+'+(i+1):''}">${l}${n?`<span class="count">${n}</span>`:''}</button>`).join('');
 $('#main').innerHTML=view==='tasks'?V.tasks():`<div class="page">${V[view]()}</div>`;
 $('#main').style.overflow=view==='tasks'?'hidden':'auto';
 rows=[...document.querySelectorAll('#rows .r')];cur=Math.max(0,Math.min(cur,rows.length-1));mark();
 if(view==='tasks')initDivider();
 $('#status').innerHTML=`<span class="note">Prototype · sample data</span><span><span class="kbd">Ctrl K</span> commands</span><span><span class="kbd">J</span><span class="kbd">K</span> move</span><span><span class="kbd">Enter</span> open</span><span><span class="kbd">E</span> done</span><span><span class="kbd">N</span> new</span><div class="spacer"></div><span>Backed up 7:02 AM</span><span>Claude · not connected</span>`;
}
function mark(){rows.forEach((r,i)=>{r.classList.toggle('cur',i===cur);r.classList.toggle('sel',view==='tasks'&&r.dataset.id==String(sel))});rows[cur]?.scrollIntoView({block:'nearest'})}
function go(v){if(v!==view)sel=null;view=v;cur=0;closeAll();render()}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1800)}
function setTheme(v){document.documentElement.dataset.theme=v==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):v}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
function closeAll(){$('#paletteScrim').classList.remove('open')}
// Selecting a task: on the Tasks screen only the right pane and highlight update, so the list keeps its scroll position.
function openTask(id){
 closeAll();sel=id??'new';
 if(view!=='tasks'){view='tasks';render()}else{$('#detail').innerHTML=detail();$('#detail').scrollTop=0}
 const i=rows.findIndex(r=>r.dataset.id==String(sel));if(i>=0)cur=i;mark();
 if(sel==='new')setTimeout(()=>$('#detail input')?.focus(),0);
}
function closeTask(){sel=null;$('#detail').innerHTML=detail();mark()}
function detail(){
 if(sel===null)return `<div style="height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)"><div><div style="font-size:28px;color:var(--faint)">☰</div><div style="color:var(--text);font-weight:500;margin-top:6px">Select a task to see it here</div><div style="margin-top:4px">Use <span class="kbd">J</span> <span class="kbd">K</span> to move through the list, or <span class="kbd">N</span> for a new task.</div></div></div>`;
 const id=sel==='new'?null:sel;
 const x=ALL.find(t=>t.id===id)||{t:'',p:null,s:0,due:'',why:'Priority is calculated when you save',who:null,st:'Open',subs:[]};
 const pc=x.p?P[x.p].c:'var(--border-strong)';
 return `<div style="height:4px;background:${pc};position:sticky;top:0;z-index:1"></div><div style="padding:16px 22px 28px">
 <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><span class="score ${sc(x.s)}" style="font-size:16px">${x.s||'—'}</span><input class="inp" style="font-size:16px;font-weight:500;border-color:transparent;background:none;padding-left:0" value="${x.t}" placeholder="Task title"><button class="iconbtn" title="Close (Esc)" onclick="closeTask()">✕</button></div>
 <div class="dgrid"><div>
  <div class="ai" style="margin-bottom:12px"><div style="font-size:12px;color:var(--accent);margin-bottom:2px">✦ Suggested next action</div>${id?'Finish the pricing assumptions slide using the 4-tier decision from Oct 29, then send Dana a one-line ask for review.':'Save the task and the AI will suggest a next step.'}</div>
  <div class="label" style="margin-bottom:4px">Subtasks</div>${x.subs.map(([s,d])=>`<div class="check"><span class="box ${d?'on':''}">${d?'✓':''}</span><span style="${d?'text-decoration:line-through;color:var(--muted)':''}">${s}</span></div>`).join('')}<div class="check faint"><span class="box"></span>Add subtask…</div>
  <div class="label" style="margin:12px 0 4px">Notes</div><textarea class="inp">${id?'Use the timeline Dana approved on Nov 1.':''}</textarea>
  <div class="label" style="margin:12px 0 4px">Activity</div><div class="muted" style="font-size:12px;line-height:1.8">${id?'Nov 1 · ✦ Status update accepted: timeline section finished<br>Oct 30 · Created from Copilot weekly summary':'No activity yet'}</div>
 </div><div class="meta">
  <div class="field" style="grid-template-columns:80px 1fr"><span>Project</span><select class="inp"><option>No project</option>${Object.entries(P).map(([k,p])=>`<option ${k==x.p?'selected':''}>${p.n}</option>`).join('')}</select></div>
  <div class="field" style="grid-template-columns:80px 1fr"><span>Status</span><select class="inp">${['Open','In progress','Waiting on','Done'].map(s=>`<option ${s==x.st?'selected':''}>${s}</option>`).join('')}</select></div>
  <div class="field" style="grid-template-columns:80px 1fr"><span>Due</span><input class="inp" value="${x.due=='—'?'':x.due}"></div>
  <div class="field" style="grid-template-columns:80px 1fr"><span>Asked by</span><select class="inp"><option>Nobody</option>${PEOPLE.map(p=>`<option ${p.n==x.who?'selected':''}>${p.n}</option>`).join('')}</select></div>
  <div class="card" style="margin-top:10px;padding:8px 10px"><div class="label">Priority ${x.s||''}</div><div style="font-size:12px">${x.why}</div><label class="muted" style="font-size:12px;display:flex;gap:6px;margin-top:4px"><input type="checkbox">Override</label></div>
  <div class="card" style="margin-top:10px;padding:8px 10px;font-size:12px;line-height:1.8"><div class="label">What the AI knows</div><span style="color:var(--ok)">✓</span> Project brief${x.p?'':' <span class="faint">(no project)</span>'}<br><span style="color:var(--ok)">✓</span> Person brief<br><span class="faint">○</span> Task brief <a href="#" style="color:var(--accent)">add</a><br><span style="color:var(--ok)">✓</span> 2 linked sources</div>
 </div></div>
 <div style="display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)"><button class="btn ghost" style="color:var(--danger)">Delete</button><div class="spacer"></div>${id?'<button class="btn" onclick="toast(\'Draft saved to Outlook. Not sent.\')">Draft reply</button><button class="btn" onclick="toast(\'Marked done\')">Mark done <span class="kbd">E</span></button>':''}<button class="btn primary" onclick="toast('Saved')">Save <span class="kbd" style="background:none;color:inherit;border-color:currentColor">Ctrl ↵</span></button></div></div>`;
}
// Draggable divider. Each pane keeps at least 360px; the split is remembered between sessions.
const MIN=360;
function setSplit(pct){const s=$('#split');if(!s)return;const w=s.clientWidth-7,lo=Math.min(50,MIN/w*100),hi=Math.max(50,100-MIN/w*100);leftPct=Math.round(Math.min(hi,Math.max(lo,pct))*10)/10;s.style.setProperty('--left',leftPct+'%');$('#divider').setAttribute('aria-valuenow',Math.round(leftPct));store.set('cos.split',leftPct)}
function initDivider(){
 const d=$('#divider'),s=$('#split');setSplit(leftPct);
 d.onpointerdown=e=>{d.setPointerCapture(e.pointerId);d.classList.add('drag');document.body.classList.add('resizing')};
 d.onpointermove=e=>{if(!d.hasPointerCapture(e.pointerId))return;const r=s.getBoundingClientRect();setSplit((e.clientX-r.left)/(r.width-7)*100)};
 d.onpointerup=e=>{d.releasePointerCapture(e.pointerId);d.classList.remove('drag');document.body.classList.remove('resizing')};
 d.ondblclick=()=>setSplit(50);
 d.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();setSplit(leftPct+(e.key==='ArrowLeft'?-2:2))}};
}
addEventListener('resize',()=>{if(view==='tasks')setSplit(leftPct)});
const CMDS=()=>[
 ...TABS.map(([k,l])=>({g:'Go to',l,a:()=>go(k)})),{g:'Go to',l:'Settings',a:()=>go('settings')},
 {g:'Actions',l:'New task',k:'N',a:()=>openTask(null)},{g:'Actions',l:'Paste a Copilot summary',a:()=>go('import')},{g:'Actions',l:'Refresh briefing',a:()=>toast('Briefing refreshed')},{g:'Actions',l:'Toggle light / dark',k:'Shift D',a:toggleTheme},
 ...T.map(t=>({g:'Tasks',l:t.t,a:()=>openTask(t.id)})),...PEOPLE.map(p=>({g:'People',l:p.n,a:()=>go('people')})),...Object.values(P).map(p=>({g:'Projects',l:p.n,a:()=>go('projects')}))];
let pcur=0,plist=[];
function openPalette(){closeAll();$('#paletteScrim').classList.add('open');$('#pq').value='';filterPalette();setTimeout(()=>$('#pq').focus(),0)}
function filterPalette(){const q=$('#pq').value.toLowerCase();plist=CMDS().filter(c=>c.l.toLowerCase().includes(q)).slice(0,14);pcur=0;drawPalette()}
function drawPalette(){let g='';$('#pr').innerHTML=plist.map((c,i)=>(c.g!==g?(g=c.g,`<div class="pg">${g}</div>`):'')+`<div class="pi ${i==pcur?'cur':''}" onclick="plist[${i}].a()"><span style="flex:1">${c.l}</span>${c.k?`<span class="kbd">${c.k}</span>`:''}</div>`).join('')||'<div class="pi faint">No matches</div>'}
$('#pq').addEventListener('input',filterPalette);
let gPending=false;
document.addEventListener('keydown',e=>{
 const pal=$('#paletteScrim').classList.contains('open'),typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal?closeAll():openPalette();return}
 if(pal){if(e.key==='Escape')closeAll();if(e.key==='ArrowDown'){pcur=Math.min(pcur+1,plist.length-1);drawPalette();e.preventDefault()}if(e.key==='ArrowUp'){pcur=Math.max(pcur-1,0);drawPalette();e.preventDefault()}if(e.key==='Enter'&&plist[pcur])plist[pcur].a();return}
 if(view==='tasks'&&sel!==null&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();toast('Saved');return}
 if(e.key==='Escape'){if(typing)document.activeElement.blur();else if(view==='tasks'&&sel!==null)closeTask();return}
 if(typing)return;
 if(view==='tasks'&&(e.key==='j'||e.key==='k')){cur=Math.max(0,Math.min(cur+(e.key==='j'?1:-1),rows.length-1));openTask(+rows[cur].dataset.id);return}
 if(view==='tasks'&&e.key==='Enter'&&sel!==null){e.preventDefault();$('#detail input')?.focus();return}
 if(e.altKey&&/^[1-9]$/.test(e.key)){go(TABS[+e.key-1][0]);return}
 if(gPending){gPending=false;const m={t:'today',k:'tasks',r:'review',w:'waiting',p:'projects',e:'people'}[e.key];if(m)go(m);return}
 const k=e.key;
 if(k==='g'){gPending=true;setTimeout(()=>gPending=false,900)}
 else if(k==='j'){cur=Math.min(cur+1,rows.length-1);mark()}
 else if(k==='k'){cur=Math.max(cur-1,0);mark()}
 else if(k==='Enter'&&rows[cur])rows[cur].click();
 else if(k==='n'){e.preventDefault();openTask(null)}
 else if(k==='e'&&rows[cur]){toast('Marked done')}
 else if(k==='w'&&rows[cur]){toast('Set to waiting on')}
 else if(k==='D'&&e.shiftKey)toggleTheme();
});
setTheme('system');render();
</script>
</body>
</html>
