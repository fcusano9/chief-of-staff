<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Email import total cost</title>
<style>
:root {
  --bg: #fafafa; --surface: #fff; --hover: #f2f2f3; --sel: #ebebee;
  --border: #e7e7ea; --border-strong: #d4d4d8; --text: #18181b; --muted: #71717a; --faint: #a1a1aa;
  --accent: #5b5bd6; --accent-bg: #ededfc; --danger: #d93a3a; --warn: #b7791f; --ok: #2f855a;
  --font: Inter, system-ui, sans-serif; --mono: ui-monospace, 'JetBrains Mono', monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0d0d10; --surface: #131317; --hover: #1c1c22; --sel: #24242c;
    --border: #25252c; --border-strong: #33333c; --text: #ececf0; --muted: #8d8d98; --faint: #5c5c66;
    --accent: #8b8bf5; --accent-bg: #25254a; --danger: #f26d6d; --warn: #e0a84a; --ok: #5cc28c; color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0d0d10; --surface: #131317; --hover: #1c1c22; --sel: #24242c;
  --border: #25252c; --border-strong: #33333c; --text: #ececf0; --muted: #8d8d98; --faint: #5c5c66;
  --accent: #8b8bf5; --accent-bg: #25254a; --danger: #f26d6d; --warn: #e0a84a; --ok: #5cc28c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.5 var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: 44px auto minmax(0, 1fr); }
button, input, select { font: inherit; color: inherit; }
.top { display: flex; align-items: center; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--surface); overflow: hidden; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-right: 14px; white-space: nowrap; }
.logo b { width: 20px; height: 20px; border-radius: 6px; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 10px; }
.tab { border: 0; background: none; padding: 6px 10px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
.tab.on { color: var(--text); background: var(--sel); }
.spacer { flex: 1; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .mono { font-family: var(--mono); }
.row { display: flex; align-items: center; gap: 8px; }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; min-height: 28px; }
h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.015em; }
.label { font-size: 12px; color: var(--muted); }
.btn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 6px; padding: 4px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.ghost { border-color: transparent; background: none; }
.btn.sm { padding: 2px 8px; font-size: 12px; }
.pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: none; border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
.pill.on { color: var(--text); border-color: var(--border-strong); background: var(--sel); }
.controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 28px; border-bottom: 1px dashed var(--border-strong); background: var(--bg); }
.controls .grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.controls .grp > span { font-size: 11px; color: var(--faint); margin-right: 2px; text-transform: uppercase; letter-spacing: .04em; }
.page { overflow: auto; padding: 22px 28px 60px; }
.grid { display: grid; gap: 12px; }
.card { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 10px 12px; }
.notes { margin-top: 26px; border: 1px dashed var(--border-strong); border-radius: 8px; padding: 12px 16px; color: var(--muted); max-width: 1000px; }
.notes h3 { margin: 0 0 6px; font-size: 12px; color: var(--text); }
.notes li { margin: 3px 0; }
.ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h2 { font-size: 13px; font-weight: 600; margin: 20px 0 8px; }
.list { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; max-width: 1100px; }
.r { display: grid; gap: 12px; align-items: center; padding: 7px 12px; border-top: 1px solid var(--border); }
.r:first-child { border-top: 0; }
.why { color: var(--faint); font-size: 12px; margin-left: 8px; }
.sm { font-size: 12px; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; margin: 12px 0 10px; }
.stats b { font: 500 18px var(--mono); display: block; }
.new { background: color-mix(in srgb, var(--accent-bg) 70%, transparent); border-radius: 4px; padding: 0 4px; box-shadow: 0 0 0 1px var(--accent); }
.wrap { max-width: 1100px; }
</style>
</head>
<body>
<div class="top">
  <div class="logo"><b>CS</b><span>Chief of Staff</span></div>
  <button class="tab">Today</button><button class="tab">Weekly</button><button class="tab">Tasks</button><button class="tab">Waiting</button>
  <button class="tab">Projects</button><button class="tab">People</button><button class="tab on">Import</button><button class="tab">Review</button>
  <div class="spacer"></div>
  <button class="btn ghost" id="theme">◐ Theme</button>
</div>

<div class="controls">
  <div class="grp"><span>Mockup</span><button class="pill" data-v="before">Before (today)</button><button class="pill" data-v="after">After</button></div>
  <div class="grp"><span>Model</span><button class="pill" data-m="claude">Claude Opus 5.5</button><button class="pill" data-m="free">Ollama (free)</button></div>
</div>

<div class="page"><div class="wrap" id="page"></div></div>

<script>
const $ = (s) => document.querySelector(s)
const state = { v: 'after', m: 'claude' }
const money = (n) => (n < 0.01 ? 'under $0.01' : n < 1 ? '$' + n.toFixed(3) : '$' + n.toFixed(2))

const CONVOS = [
  ['Q1 roadmap review: follow-ups', 'Dana Ruiz', 2, 0.041],
  ['DM-NVX firmware schedule', 'Priya Shah', 1, 0.028],
  ['Re: Pricing sheet for dealers', 'Marcus Lee', 0, 0.019],
  ['Customer escalation: Hilton Midtown', 'Tom Becker', 3, 0.052],
  ['Weekly sync notes', 'Dana Ruiz', 1, 0.024],
]
const OLDER = [['Launch checklist', 'Priya Shah', 1, 0.033], ['Re: Booth staffing', 'Marcus Lee', 0, 0.017], ['Vendor quote', 'Tom Becker', 2, 0.029]]
const total = (list) => list.reduce((t, c) => t + c[3], 0)

function hl(s) { return state.v === 'after' ? `<span class="new">${s}</span>` : '' }
function cost(list) { return state.m === 'claude' ? hl(` · est. ${money(total(list))}`) : '' }

function runRow(label, date, list, open) {
  const sugg = list.reduce((n, c) => n + c[2], 0)
  return `
  <div class="r" style="grid-template-columns: minmax(0,1fr) auto auto">
    <div class="ttl">Outlook mail · ${list.length} conversations<span class="why">Email · ${date} · ${state.m === 'claude' ? 'Claude Opus 5.5' : 'Ollama gpt-oss:20b'}</span></div>
    <span class="muted sm"><button class="btn ghost sm" style="color:var(--accent)">${sugg} to review</button>${cost(list)}</span>
    <button class="btn ghost">${open ? 'Hide conversations' : 'Conversations'}</button>
  </div>` + (open ? list.map((c) => convoRow(c)).join('') : '')
}
function convoRow(c, kind) {
  const top = kind != null
  return `
  <div class="r" style="grid-template-columns: minmax(0,1fr) auto auto auto auto auto; padding-left:${top ? 12 : 32}px; background:${top ? 'var(--surface)' : 'var(--bg)'}">
    <div class="ttl">${c[0]}<span class="why">${kind ?? 'Email'} · Nov 6 · ${c[1]}</span></div>
    <span class="muted sm">${c[2] ? `<span style="color:var(--accent)">${c[2]} to review</span>` : '0 suggestions'}${cost([c])}</span>
    ${top ? '<span></span>' : '<button class="btn ghost">Open in Outlook</button>'}<button class="btn ghost">AI log</button><button class="btn ghost">Run again</button><button class="btn ghost">Delete</button>
  </div>`
}

function render() {
  document.querySelectorAll('[data-v]').forEach((b) => b.classList.toggle('on', b.dataset.v === state.v))
  document.querySelectorAll('[data-m]').forEach((b) => b.classList.toggle('on', b.dataset.m === state.m))
  const sugg = CONVOS.reduce((n, c) => n + c[2], 0)
  $('#page').innerHTML = `
  <div class="head"><h1>Import</h1></div>
  <div class="card" style="margin-bottom:12px">
    <div class="row"><b style="font-weight:600">Outlook mail</b><span class="muted">· last imported today at 9:42 AM</span></div>
    <div class="row" style="margin-top:10px; flex-wrap:wrap">
      <span><b style="font-weight:500">5 conversations read</b><span class="muted"> · ${sugg} suggestions to review${cost(CONVOS)}</span></span>
      <div class="spacer"></div><button class="btn">Check again</button><button class="btn" style="background:var(--accent);color:#fff;border-color:var(--accent)">Go to Review</button>
    </div>
  </div>
  <div class="muted sm" style="margin-bottom:6px">(Paste box and other import options unchanged, left out here.)</div>

  <h2>Recent imports</h2>
  <div class="list">
    ${convoRow(['Roadmap sync transcript', 'Dana Ruiz', 4, 0.087], 'Meeting')}
    ${runRow('', 'Nov 6', CONVOS, true)}
    ${convoRow(['Teams chat: launch prep', 'Priya Shah', 2, 0.031], 'Teams chat')}
    ${runRow('', 'Nov 3', OLDER, false)}
  </div>

  <div class="notes">
    <h3>What changes</h3>
    <ul>
      <li><b>Finished card</b> (right after a Read): adds "est. $0.164" after the suggestion count, for the whole batch.</li>
      <li><b>Recent imports</b>: each Outlook mail row adds the batch total next to its suggestions, so older imports show it too.</li>
      <li>The total is the sum of each conversation's latest AI run, the same figures the AI log shows per email. Hover explains it's an estimate at list price.</li>
      <li>Nothing is shown for Basic or Ollama (free), the same as the AI log today. Switch Model above to see it.</li>
      <li><b>Every other import row</b> (pasted Teams chats, meetings, Copilot summaries, and each conversation inside an email import) shows its own cost after its suggestion count.</li>
      <li>Imports from before AI logs existed, or not yet read, show no cost.</li>
    </ul>
  </div>`
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.v) state.v = b.dataset.v
  if (b.dataset.m) state.m = b.dataset.m
  if (b.id === 'theme') { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark' }
  render()
})
render()
</script>
</body>
</html>
