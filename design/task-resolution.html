<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Task resolution</title>
<style>
:root {
  --bg: #fafafa; --surface: #fff; --hover: #f2f2f3; --sel: #ebebee;
  --border: #e7e7ea; --border-strong: #d4d4d8; --text: #18181b; --muted: #71717a; --faint: #a1a1aa;
  --accent: #5b5bd6; --accent-bg: #ededfc; --danger: #d93a3a; --warn: #b7791f; --ok: #2f855a;
  --font: Inter, system-ui, sans-serif; --mono: ui-monospace, 'JetBrains Mono', monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0d0d10; --surface: #131317; --hover: #1c1c22; --sel: #24242c;
    --border: #25252c; --border-strong: #33333c; --text: #ececf0; --muted: #8d8d98; --faint: #5c5c66;
    --accent: #8b8bf5; --accent-bg: #25254a; --danger: #f26d6d; --warn: #e0a84a; --ok: #5cc28c; color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0d0d10; --surface: #131317; --hover: #1c1c22; --sel: #24242c;
  --border: #25252c; --border-strong: #33333c; --text: #ececf0; --muted: #8d8d98; --faint: #5c5c66;
  --accent: #8b8bf5; --accent-bg: #25254a; --danger: #f26d6d; --warn: #e0a84a; --ok: #5cc28c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; font: 13.5px/1.55 var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
.top { display: flex; align-items: center; gap: 8px; padding: 0 16px; min-height: 44px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--surface); }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-right: 10px; white-space: nowrap; }
.logo b { width: 20px; height: 20px; border-radius: 6px; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 10px; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; flex: none; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 3px 12px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--sel); color: var(--text); }
.btn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 6px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding: 0 6px; }
.btn.ghost:hover { color: var(--text); background: var(--hover); }
.page { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }
.editor { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.stripe { height: 3px; background: #378ADD; }
.inner { padding: 18px 22px; }
.row { display: flex; align-items: center; gap: 8px; }
.score { font: 600 16px var(--mono); color: var(--warn); min-width: 26px; }
.score.done { color: var(--faint); }
.title-inp { flex: 1; font-size: 17px; font-weight: 600; border: 0; background: none; outline: 0; min-width: 0; }
.iconbtn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; margin-top: 14px; }
.label { color: var(--muted); font-size: 12.5px; margin: 16px 0 5px; }
.label:first-child { margin-top: 0; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .mono { font-family: var(--mono); }
.inp { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 7px 9px; outline: 0; }
.inp:focus { border-color: var(--accent); }
textarea.inp { min-height: 64px; resize: vertical; display: block; }
.field { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; padding: 4px 0; }
.field > span { color: var(--muted); }
.field .inp { padding: 5px 8px; }
.foot { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); }
.hist { font-size: 12.5px; color: var(--muted); line-height: 1.9; }
.hist .d { font-family: var(--mono); color: var(--faint); font-size: 11.5px; display: inline-block; min-width: 48px; }
.new { outline: 2px dashed var(--ok); outline-offset: 4px; border-radius: 6px; }
.notes { margin-top: 22px; border: 1px dashed var(--border-strong); border-radius: 8px; padding: 12px 18px; color: var(--muted); }
.notes h3 { margin: 0 0 6px; font-size: 13px; color: var(--text); }
.notes li { margin: 4px 0; }
.notes b { color: var(--text); font-weight: 500; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: grid; place-items: center; padding: 16px; z-index: 5; }
.win { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: min(480px, 100%); padding: 16px 18px; box-shadow: 0 16px 48px rgba(0,0,0,.25); }
.win h4 { margin: 0 0 2px; font-size: 14px; }
.win .sub { color: var(--muted); margin-bottom: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win textarea { min-height: 96px; }
.win .foot { margin-top: 14px; padding-top: 0; border-top: 0; }
.list { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
.lr { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-top: 1px solid var(--border); cursor: pointer; }
.lr:first-child { border-top: 0; }
.lr.sel { background: var(--sel); }
.lr .s { font: 600 13px var(--mono); min-width: 28px; }
.lr .t { flex: 1; min-width: 0; }
.lr .w { color: var(--faint); font-size: 12px; white-space: nowrap; }
.kbd { font: 11px var(--mono); border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.bar { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.rv { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 12px 14px; }
.rv .kind { font-size: 11.5px; color: var(--accent); }
.rv .t { font-weight: 600; margin: 2px 0 4px; }
.rv .why { color: var(--muted); font-size: 12.5px; }
.rv .src { color: var(--faint); font-size: 11.5px; margin-top: 6px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 7px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
.toast.on { opacity: 1; }
@media (max-width: 760px) { .dgrid { grid-template-columns: minmax(0, 1fr); } .top .logo span { display: none; } }
</style>
</head>
<body>
<div class="top">
  <div class="logo"><b>CS</b><span>Resolution mockup</span></div>
  <div class="seg">
    <button data-v="before" class="on">Before</button>
    <button data-v="prompt">Mark done</button>
    <button data-v="list">E on a list</button>
    <button data-v="status">Status dropdown</button>
    <button data-v="done">Done task</button>
    <button data-v="review">Review</button>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost" id="theme">◐ Theme</button>
</div>
<div class="page"><div id="stage"></div><div class="notes" id="notes"></div></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id)
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('on'), 1700) }
const TITLE = 'Pricing deck for the Q1 launch'
let view = 'before', status = 'Open', resolution = ''

const activity = (done) => `<div class="label">Activity</div><div class="hist">
  ${done ? `<div><span class="d">Nov 20</span>Marked done</div>` : ''}
  <div><span class="d">Nov 14</span>Due date set to Nov 24</div>
  <div><span class="d">Nov 10</span>Created from “Q1 launch sync”</div></div>`

function editor() {
  const done = status === 'Done'
  const resBox = done ? `<div class="${view === 'before' ? '' : 'new'}">
      <div class="label">Resolution</div>
      <textarea class="inp" id="res" placeholder="How it was resolved">${resolution}</textarea></div>` : ''
  const showRes = done && view !== 'before'
  return `<div class="editor"><div class="stripe"></div><div class="inner">
  <div class="row"><span class="score ${done ? 'done' : ''}">58</span><input class="title-inp" value="${TITLE}"><button class="iconbtn">✕</button></div>
  <div class="dgrid"><div>
    ${showRes ? resBox : ''}
    <div class="label">Notes</div><textarea class="inp" style="min-height:110px">Use the new margin model. Dana wants three price tiers.</textarea>
    ${activity(done && view !== 'status')}
  </div><div>
    <label class="field"><span>Project</span><select class="inp"><option>Q1 launch</option></select></label>
    <label class="field"><span>Status</span><select class="inp ${view === 'status' ? 'new' : ''}" id="st">${['Open', 'Waiting on', 'Done'].map((s) => `<option ${s === status ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
    <label class="field"><span>Due</span><input class="inp" type="date" value="2026-11-24"></label>
    <label class="field"><span>Asked by</span><select class="inp"><option>Dana Lee</option></select></label>
  </div></div>
  <div class="foot">
    <button class="btn ghost" style="color:var(--danger)">Delete</button><button class="btn ghost">Merge</button>
    <span class="spacer"></span>
    ${done ? '<button class="btn" id="reopen">Reopen</button>' : '<button class="btn" id="markdone">Mark done</button>'}
    <button class="btn primary" id="save">Save</button>
  </div>
</div></div>`
}

function dialog(title) {
  $('modal').innerHTML = `<div class="scrim" id="scrim"><div class="win new">
    <h4>Mark done</h4>
    <div class="sub">${title}</div>
    <textarea class="inp" id="dres" placeholder="Resolution (optional)"></textarea>
    <div class="foot"><span class="spacer"></span><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="ok">Mark done</button></div>
  </div></div>`
  const close = () => ($('modal').innerHTML = '')
  const finish = (text) => {
    close(); resolution = text
    if (view === 'list') { listDone = title; render(); toast(`Done: ${title}`) }
    else { status = 'Done'; view = 'done'; render(); toast(`Done: ${title}`) }
  }
  $('dres').focus()
  $('cancel').onclick = close
  $('ok').onclick = () => finish($('dres').value.trim())
  $('scrim').onclick = (e) => { if (e.target.id === 'scrim') close() }
  $('dres').onkeydown = (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) finish($('dres').value.trim())
    if (e.key === 'Escape') close()
  }
}

let listDone = null
const ROWS = [['91', 'Reply to Dana about the Q4 budget', 'Overdue by 2 days'], ['58', TITLE, 'Due in 4 days'], ['44', 'Dealer FAQ for DM-NVX 3.2 firmware', 'Due in 6 days']]
const list = () => `<div class="list">${ROWS.filter((r) => r[1] !== listDone).map((r, i) => `<div class="lr ${i === 1 ? 'sel' : ''}" data-t="${r[1]}"><span class="s" style="color:var(--warn)">${r[0]}</span><span class="t">${r[1]}</span><span class="w">${r[2]}</span></div>`).join('')}</div>
  <div class="bar"><span><span class="kbd">↑↓</span> move</span><span><span class="kbd">Enter</span> open</span><span><span class="kbd">E</span> done</span></div>`

const review = () => `<div class="rv">
  <div class="kind">Looks done</div>
  <div class="t">${TITLE}</div>
  <div class="why">Dana confirmed the deck went out to the pricing committee on Nov 19.</div>
  <div class="label new" style="margin-top:12px">Resolution</div>
  <textarea class="inp">Sent to the pricing committee on Nov 19; Dana confirmed.</textarea>
  <div class="src">From “Re: Q1 pricing deck” · Nov 19</div>
  <div class="foot"><span class="spacer"></span><button class="btn" id="rej">Reject</button><button class="btn primary" id="acc">Accept</button></div>
</div>`

const NOTES = {
  before: ['Before', ['Mark done (or E) moves the task to Done straight away. Nothing records why it closed.', 'Try <b>Mark done</b> here to compare with the next tab.']],
  prompt: ['Mark done', ['<b>Mark done</b> opens a small window with one Resolution box, focused. Ctrl+Enter or Mark done marks it done; the box can be left empty.', '<b>Cancel, Esc, or clicking outside</b> closes the window and the task stays open.', 'Pending edits in the editor are saved together with done, as today.']],
  list: ['E on a list', ['Press <b>E</b> (or click the highlighted row, standing in for E): the same window opens for that task. Tasks and Waiting both.']],
  status: ['Status dropdown', ['Pick <b>Done</b> in Status: no window; the Resolution box appears at the top of the editor right away and is saved with Save.', 'Switching back to Open hides it again.']],
  done: ['Done task', ['A done task shows <b>Resolution</b> above Notes, editable any time and saved with Save. Empty if left blank, so it can be added later.', 'Reopen keeps the text; it shows again if the task is marked done later, ready to edit.', 'Activity still says “Marked done”; the resolution text isn’t copied there or into Updates.']],
  review: ['Review: Looks done', ['A <b>Looks done</b> suggestion now has a Resolution box, filled in by the AI with what closed it (it already gives a reason). Edit it before Accept, or clear it.', 'Basic fills it with the same text as the reason.']],
}

function render() {
  document.querySelectorAll('.seg button').forEach((b) => b.classList.toggle('on', b.dataset.v === view))
  $('stage').innerHTML = view === 'list' ? list() : view === 'review' ? review() : editor()
  const [h, l] = NOTES[view]
  $('notes').innerHTML = `<h3>${h}</h3><ul>${l.map((x) => `<li>${x}</li>`).join('')}</ul>`
  const md = $('markdone')
  if (md) md.onclick = () => {
    if (view === 'before') { status = 'Done'; render(); toast(`Done: ${TITLE}`) }
    else dialog(TITLE)
  }
  const ro = $('reopen'); if (ro) ro.onclick = () => { status = 'Open'; render(); toast('Reopened on Tasks') }
  const st = $('st'); if (st) st.onchange = () => { status = st.value; render() }
  const res = $('res'); if (res) res.oninput = () => (resolution = res.value)
  const sv = $('save'); if (sv) sv.onclick = () => toast('Saved')
  document.querySelectorAll('.lr').forEach((r) => (r.onclick = () => dialog(r.dataset.t)))
  const acc = $('acc'); if (acc) acc.onclick = () => toast('Accepted: marked done with resolution')
  const rej = $('rej'); if (rej) rej.onclick = () => toast('Rejected')
}
document.querySelectorAll('.seg button').forEach((b) => (b.onclick = () => {
  view = b.dataset.v; listDone = null; $('modal').innerHTML = ''
  status = view === 'done' ? 'Done' : 'Open'
  resolution = view === 'done' ? 'Sent to the pricing committee on Nov 19. Dana approved the three tiers.' : ''
  render()
}))
window.addEventListener('keydown', (e) => {
  if (view === 'list' && e.key.toLowerCase() === 'e' && !$('modal').innerHTML) { e.preventDefault(); dialog(TITLE) }
})
$('theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark' }
render()
</script>
</body>
</html>
