<style>
/* Layout: the app's own frame (direction B): a top bar with tabs, then a work area that pairs a
   diagram with a details panel. Colors and type are the app's tokens from src/renderer/src/styles.css. */
:root {
  --bg: #fafafa; --surface: #ffffff; --raised: #ffffff; --hover: #f2f2f3; --sel: #ebebee;
  --border: #e7e7ea; --border-strong: #d4d4d8; --text: #18181b; --muted: #71717a; --faint: #a1a1aa;
  --accent: #5b5bd6; --accent-bg: #ededfc; --danger: #d93a3a; --warn: #b7791f; --ok: #2f855a;
  --primary-bg: #18181b; --primary-fg: #fafafa; --edge: #c6c6cf;
  --shadow: 0 16px 48px rgba(0, 0, 0, .14), 0 2px 8px rgba(0, 0, 0, .06);
  --k-task: #5b5bd6; --k-project: #17845f; --k-person: #2a74c4; --k-project-ctx: #b5600f;
  --k-person-ctx: #c23e70; --k-task-ctx: #627083; --k-reply: #a1379e;
  --z-ui: var(--k-person); --z-bridge: var(--k-task-ctx); --z-main: var(--k-task); --z-store: var(--k-project);
  --z-ai: var(--k-reply); --z-mail: var(--k-project-ctx); --z-outside: var(--k-task-ctx);
  --font: 'Inter Variable', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d10; --surface: #131317; --raised: #1a1a1f; --hover: #1c1c22; --sel: #24242c;
    --border: #25252c; --border-strong: #33333c; --text: #ececf0; --muted: #8d8d98; --faint: #5c5c66;
    --accent: #8b8bf5; --accent-bg: #25254a; --danger: #f26d6d; --warn: #e0a84a; --ok: #5cc28c;
    --primary-bg: #c9c9d1; --primary-fg: #17171c; --edge: #3b3b46; --shadow: 0 16px 48px rgba(0, 0, 0, .6);
    --k-task: #8b8bf5; --k-project: #5cc2a0; --k-person: #6aa8ee; --k-project-ctx: #e8a057;
    --k-person-ctx: #ef86ac; --k-task-ctx: #9aa7b8; --k-reply: #dc8ad8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d10; --surface: #131317; --raised: #1a1a1f; --hover: #1c1c22; --sel: #24242c;
  --border: #25252c; --border-strong: #33333c; --text: #ececf0; --muted: #8d8d98; --faint: #5c5c66;
  --accent: #8b8bf5; --accent-bg: #25254a; --danger: #f26d6d; --warn: #e0a84a; --ok: #5cc28c;
  --primary-bg: #c9c9d1; --primary-fg: #17171c; --edge: #3b3b46; --shadow: 0 16px 48px rgba(0, 0, 0, .6);
  --k-task: #8b8bf5; --k-project: #5cc2a0; --k-person: #6aa8ee; --k-project-ctx: #e8a057;
  --k-person-ctx: #ef86ac; --k-task-ctx: #9aa7b8; --k-reply: #dc8ad8;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: .9em; }
code { background: var(--hover); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; white-space: normal; overflow-wrap: anywhere; }
a.src code { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; }

/* Plain and Developer layers. */
body:not(.dev) .dev { display: none !important; }
body.dev .plain { display: none !important; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-row { display: flex; align-items: center; gap: 14px; min-height: 50px; max-width: 1480px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.logo { width: 26px; height: 26px; border-radius: 6px; background: var(--text); color: var(--bg); font: 600 11px var(--mono); display: grid; place-items: center; }
.brand-name { font-weight: 600; white-space: nowrap; }
.brand-ver { font: 500 11px var(--mono); color: var(--muted); white-space: nowrap; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; border: 0; background: none; color: var(--muted); font-weight: 500; font-size: 13px; padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.tab:hover { background: var(--hover); color: var(--text); }
.tab[aria-selected="true"] { background: var(--sel); color: var(--text); }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.search { position: relative; }
.search input { width: 200px; font: 13px var(--font); color: var(--text); background: var(--hover); border: 1px solid var(--border); border-radius: 6px; padding: 6px 28px 6px 10px; }
.search input::placeholder { color: var(--faint); }
.search .kbd { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); }
.kbd { font: 500 10.5px var(--mono); color: var(--muted); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
.results { position: absolute; right: 0; top: calc(100% + 6px); width: min(440px, calc(100vw - 32px)); background: var(--raised); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; z-index: 40; max-height: 60vh; overflow: auto; }
.result { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 7px 8px; cursor: pointer; }
.result:hover, .result.on { background: var(--hover); }
.result .rt { font: 500 10.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
.result b { font-weight: 600; display: block; }
.result span.d { color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.seg { display: inline-flex; background: var(--hover); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
.seg button { border: 0; background: none; border-radius: 4px; padding: 3px 9px; font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--primary-bg); color: var(--primary-fg); border-color: var(--primary-bg); }
.btn:disabled { opacity: .45; cursor: default; }
@media (max-width: 1180px) {
  .top-row { flex-wrap: wrap; padding-block: 8px 0; gap: 8px 12px; }
  .tabs { order: 3; flex-basis: 100%; padding-bottom: 6px; }
  .tools { margin-left: auto; }
}
@media (max-width: 640px) {
  .brand-ver { display: none; }
  .tools { flex-basis: 100%; margin-left: 0; min-width: 0; }
  .search { flex: 1; min-width: 0; }
  .search input { width: 100%; }
}

/* Page */
main { max-width: 1480px; margin: 0 auto; padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
.view-head p { color: var(--muted); max-width: 72ch; margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; min-width: 0; }
.kicker { font: 600 10.5px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1000px) { .grid3, .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid2, .grid3, .grid4 { grid-template-columns: minmax(0, 1fr); } }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px var(--mono); padding: 2px 7px; border: 1px solid var(--border); border-radius: 4px; background: var(--hover); color: var(--text); text-decoration: none; cursor: default; overflow-wrap: anywhere; }
a.chip, button.chip { cursor: pointer; }
a.chip:hover, button.chip:hover { border-color: var(--accent); text-decoration: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
.pill:hover { color: var(--text); }
.pill[aria-pressed="true"] { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); color: var(--text); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--accent)); }
ul.clean { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
ul.ticks { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.tag { display: inline-block; font: 600 10.5px var(--font); letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--hover); color: var(--muted); }
.tag.out { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.tag.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.tag.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.tag.ai { background: color-mix(in srgb, var(--k-reply) 14%, transparent); color: var(--k-reply); }

/* Diagram + panel */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr); } }
.canvas { display: flex; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: auto; max-height: max(420px, calc(100vh - 150px)); overscroll-behavior: contain; }
.canvas svg { display: block; flex: none; user-select: none; -webkit-user-select: none; }
.canvas .room { flex: none; width: 0; height: 1px; }
.canvas.pan { cursor: grab; }
.canvas.panning { cursor: grabbing; }
.canvas.panning .node { cursor: grabbing; }
.zoomwrap { position: relative; min-width: 0; }
.zoombar { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; align-items: center; gap: 2px; padding: 3px; background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 1px 3px rgba(0, 0, 0, .06); }
.zoombar button { appearance: none; border: 0; background: none; color: var(--text); font: 600 14px var(--font); min-width: 28px; height: 26px; padding: 0 7px; border-radius: 5px; cursor: pointer; }
.zoombar button:hover { background: var(--hover); }
.zoombar button.txt { font-size: 12px; font-weight: 500; }
.zoombar.inline { position: static; margin-left: auto; box-shadow: none; padding: 2px; }
.zoombar .zv { font: 500 11.5px var(--mono); color: var(--muted); min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
.view:fullscreen { background: var(--bg); padding: 16px 20px; overflow: auto; }
.mapbox { position: relative; min-width: 0; }
.panel[hidden] { display: none; }
.panel.drawer { position: absolute; top: 8px; right: 8px; width: var(--drawer); max-height: calc(100% - 16px); overflow: auto; z-index: 4; box-shadow: var(--shadow); padding-top: 14px; }
.mapbox { --drawer: min(360px, calc(100% - 16px)); }
.panel.drawer > div:first-of-type { padding-right: 30px; }
.drawer .x { position: absolute; top: 10px; right: 10px; appearance: none; border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; }
.drawer .x:hover { background: var(--hover); color: var(--text); }
@media (max-width: 760px) {
  .panel.drawer { position: relative; inset: auto; width: auto; margin-top: 12px; box-shadow: none; }
}
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
@media (min-width: 1101px) { .panel { position: sticky; top: 66px; max-height: calc(100vh - 84px); overflow: auto; } }
.panel h2 { font-size: 18px; }
.panel .sec { display: grid; gap: 6px; }
.panel .sec > h3 { font: 600 10.5px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.files { display: grid; gap: 6px; }
.file { display: grid; gap: 3px; }
.file a { font: 500 12px var(--mono); overflow-wrap: anywhere; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 0; border-top: 2px solid var(--edge); display: inline-block; }
.legend i.out { border-color: var(--danger); }
.legend i.sync { border-top-style: dashed; }
.legend i.hi { border-color: var(--accent); }
.overlay-note { font-size: 12.5px; color: var(--muted); min-height: 1.5em; }
.maprow { display: flex; align-items: center; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; }
.maprow .overlay-note { flex: 1 1 320px; }
#map-zoom { margin-left: auto; }

svg text { font-family: var(--font); }
.zone rect { fill: color-mix(in srgb, var(--zc) 5%, var(--surface)); stroke: color-mix(in srgb, var(--zc) 30%, var(--border)); }
.zone .zl { font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; fill: color-mix(in srgb, var(--zc) 80%, var(--text)); }
.zone .zs { font-family: var(--mono); font-size: 11px; font-weight: 400; letter-spacing: 0; text-transform: none; fill: var(--faint); }
.glabel { font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; fill: var(--faint); }
.node { cursor: pointer; transition: opacity .15s; }
.node .box { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1; transition: stroke .12s; }
.node .stripe { fill: var(--zc); }
.node .nl { font-size: 13px; font-weight: 600; fill: var(--text); }
.node .nh { font-size: 11.5px; fill: var(--muted); }
.node .nd { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
.node:hover .box, .node:focus-visible .box { stroke: var(--accent); }
.node:focus { outline: none; }
.node:focus-visible .box { stroke-width: 2; }
.node.sel .box { stroke: var(--accent); stroke-width: 2; fill: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.3; transition: opacity .15s; }
.edge.detail { display: none; }
.edge.detail.show { display: inline; }
.edge.sync { stroke-dasharray: 4 3; }
.edge.out { stroke: color-mix(in srgb, var(--danger) 70%, var(--edge)); }
.edge.hi { stroke: var(--accent); stroke-width: 2; }
.edge.out.hi { stroke: var(--danger); }
.edge.flow { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 7 5; animation: dash 1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -24; } }
.elabel { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; display: none; }
.elabel.show { display: inline; }
.arrow { fill: var(--edge); }
.arrow.hi { fill: var(--accent); }
.arrow.out { fill: var(--danger); }
svg.focus .node:not(.hi) { opacity: .26; }
svg.focus .edge:not(.hi) { opacity: .12; }
svg.focus .elabel:not(.hi) { display: none; }
svg.focus .zone { opacity: .75; }
@media (prefers-reduced-motion: reduce) { .edge.flow { animation: none; } .node, .edge { transition: none; } }

/* Overview */
.hero { display: grid; gap: 10px; max-width: 82ch; }
.hero p { font-size: 15px; color: var(--muted); }
.hero p strong { color: var(--text); }
.counts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .counts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.count { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.count:hover { border-color: var(--accent); }
.count b { display: block; font: 600 24px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.count span { font-size: 12px; color: var(--muted); }
.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; counter-reset: step; }
@media (max-width: 760px) { .pipeline { grid-template-columns: minmax(0, 1fr); } }
.pstep { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px 14px; display: grid; gap: 6px; align-content: start; text-align: left; cursor: pointer; }
.pstep:hover { border-color: var(--accent); }
.pstep .n { font: 600 11px var(--mono); color: var(--accent); }
.pstep p { color: var(--muted); font-size: 13px; }
.rulecards { display: grid; gap: 10px; align-content: start; }
.rc { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; }
.rc .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 600 11px var(--mono); background: var(--accent-bg); color: var(--accent); }
.rc p { color: var(--muted); font-size: 13px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font: 600 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); }
table.t td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.where-card { display: grid; gap: 8px; align-content: start; }
.where-card .who { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* Flows */
.flow-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; counter-reset: s; }
.step { border: 1px solid transparent; border-radius: 6px; padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }
.step:hover { background: var(--hover); }
.step .sn { font: 600 11px var(--mono); color: var(--muted); padding-top: 1px; }
.step .st { font-weight: 600; }
.step .sb { display: none; color: var(--muted); font-size: 13px; margin-top: 3px; }
.step .sc { display: none; margin-top: 5px; font-size: 12px; }
.step.on { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.step.on .sn { color: var(--accent); }
.step.on .sb, .step.on .sc { display: block; }
body:not(.dev) .step.on .sc { display: none; }

  "flows": [
    { "id": "startup", "title": "App startup", "summary": "What happens between opening the app and seeing Today. The order is chosen so real data is never opened by the wrong copy, and never upgraded without a safety copy.",
      "steps": [
        { "title": "Pick the data folder", "text": "The installed app uses the real data folder. Running from source or a test uses its own folder, so real data is never touched by a test.", "nodes": ["svc-startup"], "code": "src/main/paths.ts · chooseDataLocation" },
        { "title": "Check nothing redirects it", "text": "On Windows the installed app writes a probe file and checks it didn't land in another app's private copy, as happens when it's started from Claude Desktop. If it did, it says so and quits.", "nodes": ["svc-startup"], "code": "src/main/paths.ts · findRedirectingPackage" },
        { "title": "Only one copy", "text": "A second copy brings the first one forward and quits before opening the database.", "nodes": ["svc-startup"], "code": "src/main/index.ts · requestSingleInstanceLock" },
        { "title": "Load the settings", "text": "Settings are read first, because the upgrade step needs to know where backups go.", "nodes": ["svc-startup", "svc-settings", "st-settings"], "edges": [["svc-startup", "svc-settings"], ["svc-settings", "st-settings"]], "code": "src/main/services/settings.ts · SettingsStore" },
        { "title": "Apply a pending restore", "text": "If the user chose Restore, the chosen backup replaces the database file now, before anything opens it.", "nodes": ["svc-backup", "st-backups", "st-db"], "edges": [["st-backups", "st-db"]], "code": "src/main/services/backup.ts · applyPendingRestore" },
        { "title": "Open and upgrade the database", "text": "If the database needs upgrading, a safety copy is written first. If no copy can be made, the upgrade doesn't run and the app shows an error.", "nodes": ["svc-startup", "st-db", "svc-backup", "st-backups"], "edges": [["svc-startup", "st-db"], ["svc-backup", "st-backups"]], "code": "src/main/db.ts · openDatabase" },
        { "title": "Build the services", "text": "Each part of the app is created with the database and the settings it needs.", "nodes": ["main-ipc", "svc-tasks", "svc-directory", "svc-import", "svc-review", "svc-mail", "svc-briefing", "svc-weekly", "svc-replies", "svc-keys"], "code": "src/main/index.ts · startDatabase" },
        { "title": "Recompute and save weeks", "text": "Every open task's score is recomputed, and any week that ended since the last run is saved.", "nodes": ["svc-tasks", "svc-weekly", "st-db"], "edges": [["svc-startup", "svc-tasks"], ["svc-startup", "svc-weekly"]], "code": "src/main/services/tasks.ts · recomputeAll" },
        { "title": "Open the window", "text": "The handlers are registered and the window opens with a sandboxed screen that can only use the named calls.", "nodes": ["ui-today", "bridge", "main-ipc"], "edges": [["ui-today", "bridge"], ["bridge", "main-ipc"]], "code": "src/main/index.ts · createWindow" },
        { "title": "Back up if due, then every 30 minutes", "text": "A daily backup is made if the last one is over 20 hours old. The timer repeats the recompute, the week saving, and the backup check every 30 minutes.", "nodes": ["svc-startup", "svc-backup", "st-backups", "ext-onedrive"], "edges": [["svc-startup", "svc-backup"], ["svc-backup", "st-backups"], ["st-backups", "ext-onedrive"]], "code": "src/main/index.ts · backupIfDue" }
      ] },
    { "id": "import", "title": "Text import to Review", "summary": "The user pastes text and clicks Extract. The AI reads it next to everything open and proposes changes; nothing changes until the user accepts.",
      "steps": [
        { "title": "Paste and Extract", "text": "The user pastes or drops text, checks the date at the top right, and clicks Extract.", "nodes": ["ui-import", "bridge", "main-ipc"], "edges": [["ui-import", "bridge"], ["bridge", "main-ipc"]], "code": "src/renderer/src/screens/ImportScreen.tsx · ImportScreen" },
        { "title": "Tidy, check, name", "text": "Transcript timings are removed. The same text again stops here and nothing is sent. A Copilot answer is named and dated from its marker line; anything else gets a first guess at its kind and the first line as its name.", "nodes": ["svc-import", "st-db"], "edges": [["main-ipc", "svc-import"], ["svc-import", "st-db"]], "code": "src/main/services/sources.ts · importAndExtract" },
        { "title": "Build the request", "text": "The request holds the item plus every open task (with its score and latest updates), the projects that aren't archived, and the people. A three-week calendar resolves “Friday”. The item is fenced off as data.", "nodes": ["svc-import", "ai-checks"], "edges": [["svc-import", "ai-checks"]], "code": "src/main/ai/context.ts · buildExtractionContext" },
        { "title": "The selected AI reads it", "text": "Claude answers in one request, Ollama in up to three short passes, Basic with simple rules. Only Claude's request leaves the computer.", "nodes": ["svc-import", "ai-provider", "ai-basic", "ai-ollama", "ai-claude", "ext-anthropic", "ext-ollama"], "edges": [["svc-import", "ai-provider"], ["ai-provider", "ai-claude"], ["ai-claude", "ext-anthropic"], ["ai-provider", "ai-ollama"], ["ai-ollama", "ext-ollama"]], "code": "src/main/ai/provider.ts · AiProvider" },
        { "title": "Log every request", "text": "Each request and answer is kept exactly as sent and received, with timing and tokens. Paid Claude requests are counted in AI spending.", "nodes": ["svc-ailog", "svc-usage"], "edges": [["svc-import", "svc-ailog"], ["svc-ailog", "svc-usage"]], "code": "src/main/services/ai-log.ts · AiLogService" },
        { "title": "Check the answer", "text": "Suggestions naming tasks that don't exist are dropped, duplicates removed, and people and projects already known aren't proposed again. For mail, no Needs reply if the user wrote last. The AI log records what was dropped and why.", "nodes": ["ai-checks", "svc-import"], "edges": [["ai-checks", "svc-import"]], "code": "src/main/ai/schema.ts · validateSuggestions" },
        { "title": "Apply cards and priority changes", "text": "Status cards and AI priority changes for the open tasks it's about are saved right away, even if the user later rejects the suggestions. Tasks it proposes to mark done get none.", "nodes": ["svc-cards", "svc-adjust", "svc-activity"], "edges": [["svc-import", "svc-cards"], ["svc-import", "svc-adjust"], ["svc-adjust", "svc-activity"]], "code": "src/main/services/next-actions.ts · cleanNextActions" },
        { "title": "Suggestions wait in Review", "text": "This import's earlier pending suggestions are replaced by the new ones, new projects and people first. The Review tab appears with its count.", "nodes": ["svc-review", "ui-review", "st-db"], "edges": [["svc-import", "svc-review"]], "code": "src/main/services/sources.ts · extract" }
      ] },
    { "id": "accept", "title": "Accepting in Review", "summary": "The user goes through the queue with A to accept, R to reject, and Enter to edit. Each accept is one step that either fully happens or doesn't happen at all.",
      "steps": [
        { "title": "Open Review", "text": "Pending suggestions are listed with a colored chip for their kind.", "nodes": ["ui-review", "bridge", "main-ipc", "svc-review"], "edges": [["ui-review", "bridge"], ["bridge", "main-ipc"], ["main-ipc", "svc-review"]], "code": "src/main/services/suggestions.ts · listPending" },
        { "title": "Edit, then accept", "text": "The user can change the title, date, project, who asked, the details, or the role and company before accepting.", "nodes": ["ui-review"], "code": "src/renderer/src/screens/ReviewScreen.tsx · ReviewScreen" },
        { "title": "Create linked items first", "text": "A task linked to a proposed project or person creates that project or person first (or reuses one with the same name), so the link is real.", "nodes": ["svc-review", "svc-directory"], "edges": [["svc-review", "svc-directory"]], "code": "src/main/services/suggestions.ts · createdBy" },
        { "title": "Apply the suggestion", "text": "New task and Needs reply create an open task. Waiting on moves a task to Waiting. Status update adds a dated update. Looks done marks it done. Context adds an update to a project, person, or task.", "nodes": ["svc-review", "svc-tasks", "svc-directory"], "edges": [["svc-review", "svc-tasks"], ["svc-review", "svc-directory"]], "code": "src/main/services/suggestions.ts · accept" },
        { "title": "Score it and record who", "text": "The task is rescored, and Activity records each change as “from the import, accepted in Review”.", "nodes": ["svc-tasks", "svc-activity", "st-db"], "edges": [["svc-tasks", "svc-activity"], ["svc-tasks", "st-db"]], "code": "src/main/services/task-events.ts · taskChanges" },
        { "title": "Link it to its import", "text": "The task is linked to the import it came from and the suggestion is marked accepted, all in the same transaction.", "nodes": ["svc-review", "st-db"], "edges": [["svc-review", "st-db"]], "code": "src/main/db.ts · transaction" },
        { "title": "Every list asks again", "text": "The screen bumps a version number and every list fetches itself again, so Tasks, Today, and the Review count are current.", "nodes": ["ui-tasks", "ui-today", "ui-review"], "code": "src/renderer/src/App.tsx · refresh" }
      ] },
    { "id": "mail", "title": "Mail Check and Read", "summary": "Two clicks: Check only looks at the mailbox; Read sends the chosen conversations to the AI, one at a time, while the screen shows progress.",
      "steps": [
        { "title": "Check", "text": "The mail app is asked for Inbox, its subfolders, and Sent since the last finished import (7 days back the first time). Nothing goes to the AI.", "nodes": ["ui-import", "svc-mail", "mail-outlook", "mail-apple", "ext-outlook", "ext-mail"], "edges": [["svc-mail", "mail-outlook"], ["mail-outlook", "ext-outlook"], ["svc-mail", "mail-apple"], ["mail-apple", "ext-mail"]], "code": "src/main/services/mail.ts · check" },
        { "title": "Plan the conversations", "text": "Messages are grouped into conversations. Invites, automatic replies, newsletters, and automated senders are skipped, and messages already read are left out.", "nodes": ["svc-mail"], "code": "src/main/mail/plan.ts · planMailbox" },
        { "title": "Read", "text": "The user picks Read. It runs in the background, one conversation at a time; the screen asks for progress every 0.7 seconds.", "nodes": ["ui-import", "bridge", "main-ipc", "svc-mail"], "edges": [["ui-import", "bridge"], ["bridge", "main-ipc"], ["main-ipc", "svc-mail"]], "code": "src/main/services/mail.ts · read" },
        { "title": "Fetch the text (Apple Mail)", "text": "Apple Mail is slow to give message text, so it's fetched only now, and only for the messages the AI will read.", "nodes": ["mail-apple", "ext-mail"], "edges": [["svc-mail", "mail-apple"], ["mail-apple", "ext-mail"]], "code": "src/main/mail/applemail.ts · fillBodies" },
        { "title": "Save as one import", "text": "Each conversation becomes one import, oldest message first, with quoted history kept only under the first. Every message is recorded so it's never read twice.", "nodes": ["svc-mail", "st-db"], "edges": [["svc-mail", "st-db"]], "code": "src/main/mail/plan.ts · conversationContent" },
        { "title": "Extract like any import", "text": "The conversation goes through Import. Mail rules apply: no Needs reply if the user wrote last, and a wait starts when the user sent the ask.", "nodes": ["svc-mail", "svc-import", "ai-provider"], "edges": [["svc-mail", "svc-import"], ["svc-import", "ai-provider"]], "code": "src/main/services/sources.ts · applyMailRules" },
        { "title": "Review fills up as it goes", "text": "Suggestions reach Review after each conversation. Stop finishes the current one; the rest are offered next time, and the start date doesn't move.", "nodes": ["svc-review", "ui-review"], "edges": [["svc-import", "svc-review"]], "code": "src/main/services/mail.ts · MailService" }
      ] },
    { "id": "briefing", "title": "Daily briefing", "summary": "Written only when the user clicks Write briefing. The AI chooses and words; the items always come from real tasks.",
      "steps": [
        { "title": "Write briefing", "text": "The user clicks Write briefing on Today (or uses Ctrl+K). A second click while it's writing waits for the same one.", "nodes": ["ui-today", "bridge", "main-ipc", "svc-briefing"], "edges": [["ui-today", "bridge"], ["bridge", "main-ipc"], ["main-ipc", "svc-briefing"]], "code": "src/main/services/briefings.ts · write" },
        { "title": "Gather what's open", "text": "The top 25 open tasks by priority (every overdue one, even past 25), the 20 longest waits, what's new since the last briefing, and the number of new Review suggestions.", "nodes": ["svc-briefing", "svc-tasks"], "edges": [["svc-briefing", "svc-tasks"]], "code": "src/main/services/briefings.ts · buildInput" },
        { "title": "Ask the AI", "text": "The selected AI picks the top priorities and follow-ups, writes notes, and may write next steps and priority changes. Basic uses simple rules.", "nodes": ["svc-briefing", "ai-provider", "ai-claude", "ai-ollama", "ai-basic"], "edges": [["svc-briefing", "ai-provider"], ["ai-provider", "ai-claude"]], "code": "src/main/ai/claude.ts · buildBriefingRequest" },
        { "title": "Assemble from real tasks", "text": "Every overdue task goes first. Ids the AI made up are dropped. Do next holds up to 5, Follow up 3, New 8.", "nodes": ["ai-checks", "svc-briefing"], "edges": [["ai-checks", "svc-briefing"]], "code": "src/main/ai/briefing.ts · assembleBriefing" },
        { "title": "Save it all together", "text": "The briefing, its AI requests, the usage, each Do next task's status card, and any priority changes are saved in one step. AI requests are kept for the newest 5 briefings.", "nodes": ["svc-briefing", "st-db", "svc-cards", "svc-adjust", "svc-usage"], "edges": [["svc-briefing", "svc-cards"], ["svc-briefing", "svc-adjust"], ["svc-briefing", "svc-usage"]], "code": "src/main/services/briefings.ts · writeNow" },
        { "title": "Shown on Today", "text": "Tags like Overdue, Due today, or Waiting 8 days come from the task data, never the AI. History keeps every briefing.", "nodes": ["ui-today"], "code": "src/renderer/src/components/Briefing.tsx · Briefing" }
      ] },
    { "id": "weekly", "title": "Weekly review", "summary": "The lists need no AI and build themselves. Ended weeks are saved once and frozen; the reflection is written only on click.",
      "steps": [
        { "title": "Open Weekly", "text": "Any week that has ended since the last run is saved first.", "nodes": ["ui-weekly", "bridge", "main-ipc", "svc-weekly"], "edges": [["ui-weekly", "bridge"], ["bridge", "main-ipc"], ["main-ipc", "svc-weekly"]], "code": "src/main/services/weekly.ts · saveEndedWeeks" },
        { "title": "Build the current week live", "text": "Completed, New, Slipping, and Waiting on come from task dates, plus the Activity log for due dates that were pushed back.", "nodes": ["svc-weekly", "svc-tasks", "svc-activity"], "edges": [["svc-weekly", "svc-tasks"], ["svc-weekly", "svc-activity"]], "code": "src/main/services/weekly.ts · lists" },
        { "title": "Ended weeks are frozen", "text": "A saved week never changes. Weeks before the review started, and weeks the app wasn't opened the week after, are partly recorded: Completed and New only.", "nodes": ["svc-weekly", "st-db"], "edges": [["svc-weekly", "st-db"]], "code": "src/main/services/weekly.ts · WeeklyService" },
        { "title": "Write the reflection", "text": "On click, for the current week only: the AI writes a summary, Went well, Slipped, and Focus next.", "nodes": ["svc-weekly", "ai-provider"], "edges": [["svc-weekly", "ai-provider"]], "code": "src/main/services/weekly.ts · writeReflection" },
        { "title": "Tidy and keep", "text": "The answer is tidied and saved with the tasks it was written from, so the screen can say when tasks have changed since.", "nodes": ["ai-checks", "svc-weekly", "st-db"], "edges": [["ai-checks", "svc-weekly"]], "code": "src/main/ai/weekly.ts · assembleReflection" },
        { "title": "The timer keeps it current", "text": "Every 30 minutes the app checks whether a week has ended and saves it.", "nodes": ["svc-startup", "svc-weekly"], "edges": [["svc-startup", "svc-weekly"]], "code": "src/main/index.ts · saveEndedWeeks" }
      ] },
    { "id": "status", "title": "Write “Where this stands”", "summary": "The card on a task or project, written when the user clicks Write. It's for copying; it changes nothing.",
      "steps": [
        { "title": "Click Write", "text": "On the task or project card. Not offered on done tasks; greyed out with Basic.", "nodes": ["ui-tasks", "bridge", "main-ipc"], "edges": [["ui-tasks", "bridge"], ["bridge", "main-ipc"]], "code": "src/renderer/src/components/StatusCard.tsx · StatusCard" },
        { "title": "Gather the facts", "text": "Status, due date, project, who asked, subtasks, Notes (1,000 characters), latest updates (1,500), and the newest 20 Activity lines. With nothing to go on, it refuses.", "nodes": ["main-ipc", "svc-tasks", "svc-activity", "svc-directory"], "edges": [["main-ipc", "svc-tasks"], ["main-ipc", "svc-activity"]], "code": "src/main/ai/status.ts · buildTaskStatusInput" },
        { "title": "Ask the AI", "text": "For 2–3 short bullets a manager could read, and one next step starting with a verb.", "nodes": ["svc-cards", "ai-provider", "ai-claude", "ai-ollama"], "edges": [["svc-cards", "ai-provider"], ["ai-provider", "ai-claude"]], "code": "src/main/ai/provider.ts · writeStatus" },
        { "title": "Check the answer", "text": "At most 3 bullets of 240 characters, a step of 200. No bullets or no step means no card.", "nodes": ["ai-checks"], "edges": [["ai-provider", "ai-checks"]], "code": "src/main/ai/status.ts · cleanStatusCard" },
        { "title": "Save the card", "text": "It replaces the task's card. The request counts in AI spending as “Where this stands”.", "nodes": ["svc-cards", "st-db", "svc-usage"], "edges": [["svc-cards", "st-db"]], "code": "src/main/services/next-actions.ts · NextActionService" },
        { "title": "Copy from it", "text": "Copy on each part. Marked out of date in amber when an update dated a later day arrives.", "nodes": ["ui-tasks"] }
      ] },
    { "id": "reply", "title": "Draft reply to Drafts", "summary": "On a task linked to an email: the AI writes a first draft, the user edits it, and it's saved to Drafts or opened in a window. It's never sent.",

 "rules": [
  {
   "id": "b",
   "title": "Business rules at a glance",
   "file": "docs/BUSINESS-RULES.md",
   "intro": [
    {
     "type": "p",
     "html": "Every rule the app follows, on one page: how tasks are scored and listed, what Review does, how mail, meetings, the briefing, the weekly review, and backups behave. It says what the code does today. The rules for the AI itself (what it's sent, what it may answer, its limits) are in \u003ca href=\"https://github.com/fcusano9/chief-of-staff/blob/main/docs/AI-RULES.md\">AI-RULES.md\u003c/a>, and the reasons behind each choice are in \u003ca href=\"https://github.com/fcusano9/chief-of-staff/blob/main/docs/DECISIONS.md\">DECISIONS.md\u003c/a>."
    },
    {
     "type": "p",
     "html": "\u003cstrong>Keep this file current.\u003c/strong> Any change to a rule below updates this page in the same PR. Then run \u003ccode>npm run docs\u003c/code>, which rebuilds the interactive guide (\u003ca href=\"#overview\">architecture.html\u003c/a>); \u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/tests/docs.test.ts\">\u003ccode>tests/docs.test.ts\u003c/code>\u003c/a> fails until you do."
    }
   ],
   "sections": [
    {
     "id": "b-principles",
     "title": "Principles",
     "level": 2,
     "blocks": [
      {
       "type": "table",
       "head": [
        "Rule",
        "Detail",
        "Where"
       ],
       "rows": [
        [
         "The AI only proposes",
         "Every suggestion waits in Review and changes nothing until the user accepts it. The only exceptions are small, marked, and undoable: &quot;Where this stands&quot; cards and AI priority changes.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/services/suggestions.ts\">\u003ccode>src/main/services/suggestions.ts\u003c/code>\u003c/a> · \u003ccode>accept\u003c/code>"
        ],
        [
         "Nothing is sent",
         "The app never sends email, messages, or invites. The mail scripts never send, move, delete, or flag mail. Draft replies are saved as drafts or opened in a window, never sent.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/mail/outlook.ps1\">\u003ccode>src/main/mail/outlook.ps1\u003c/code>\u003c/a>, \u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/mail/applemail.jxa\">\u003ccode>src/main/mail/applemail.jxa\u003c/code>\u003c/a>"
        ],
        [
         "Runs when the user acts",
         "No AI request runs on a schedule. The only timer recomputes scores, saves ended weeks, reads the calendar, and makes the daily backup.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/index.ts\">\u003ccode>src/main/index.ts\u003c/code>\u003c/a>"
        ],
        [
         "Data stays on this computer",
         "One SQLite database and a settings file in the app's data folder. The API key is encrypted by the operating system. Only the AI provider the user picks sees any data (see AI choice).",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/db.ts\">\u003ccode>src/main/db.ts\u003c/code>\u003c/a>, \u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/services/secrets.ts\">\u003ccode>src/main/services/secrets.ts\u003c/code>\u003c/a>"
        ],
        [
         "No guessing",
         "AI answers that name tasks, projects, or people that don't exist, or put items in the wrong section, are dropped rather than repaired.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/ai/schema.ts\">\u003ccode>src/main/ai/schema.ts\u003c/code>\u003c/a> · \u003ccode>validateSuggestions\u003c/code>"
        ]
       ]
      }
     ]
    },
    {
     "id": "b-tasks",
     "title": "Tasks",
     "level": 2,
     "blocks": [
      {
       "type": "table",
       "head": [
        "Rule",
        "Detail",
        "Where"
       ],
       "rows": [
        [
         "Statuses",
         "Open, Waiting on, and Done. &quot;In progress&quot; was removed (old ones became Open); &quot;proposed&quot; and &quot;dismissed&quot; are old values nothing uses.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/shared/types.ts\">\u003ccode>src/shared/types.ts\u003c/code>\u003c/a> · \u003ccode>TaskStatus\u003c/code>"
        ],
        [
         "A title is needed",
         "A task can't be saved without one (&quot;A task needs a title.&quot;).",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/services/tasks.ts\">\u003ccode>src/main/services/tasks.ts\u003c/code>\u003c/a> · \u003ccode>save\u003c/code>"
        ],
        [
         "Projects are optional",
         "A task with no project shows no label and a neutral stripe.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/shared/types.ts\">\u003ccode>src/shared/types.ts\u003c/code>\u003c/a> · \u003ccode>NO_PROJECT_COLOR\u003c/code>"
        ],
        [
         "Entering Waiting on",
         "Records who it waits on and when the wait started: now, or when the user sent the email for an item from mail. Staying in Waiting on keeps the first start time. Leaving it clears both.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/services/tasks.ts\">\u003ccode>src/main/services/tasks.ts\u003c/code>\u003c/a> · \u003ccode>save\u003c/code>"
        ],
        [
         "Entering Done",
         "Records when it was finished and, if it was waiting, who it was waiting on, so Done lists and Reopen know where it came from.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/services/tasks.ts\">\u003ccode>src/main/services/tasks.ts\u003c/code>\u003c/a> · \u003ccode>save\u003c/code>"
        ],
        [
         "Reopen",
         "A finished item goes back where it came from: Waiting (on the same person) if it was waiting, otherwise Tasks.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/services/tasks.ts\">\u003ccode>src/main/services/tasks.ts\u003c/code>\u003c/a> · \u003ccode>reopen\u003c/code>"
        ],
        [
         "Every save",
         "Updates the task's last activity, recomputes its score, and records each changed field in Activity.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/services/tasks.ts\">\u003ccode>src/main/services/tasks.ts\u003c/code>\u003c/a> · \u003ccode>save\u003c/code>"
        ],
        [
         "Subtasks",
         "A checklist in order. Empty ones are dropped on save. Subtask changes aren't recorded in Activity.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/services/tasks.ts\">\u003ccode>src/main/services/tasks.ts\u003c/code>\u003c/a> · \u003ccode>syncSubtasks\u003c/code>"
        ],
        [
         "Delete",
         "Removes the task with its subtasks, Updates, status card, AI change, and Activity. The imports it came from stay.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/services/tasks.ts\">\u003ccode>src/main/services/tasks.ts\u003c/code>\u003c/a> · \u003ccode>delete\u003c/code>"
        ],
        [
         "Merge",
         "Two open tasks, or two waiting items, become one (never a task with a waiting item, and never a Done item). Starts from the task editor's Merge button, or Ctrl+K &quot;Merge with…&quot; while one is open; pending edits are saved first. The item the editor shows is kept and the other is removed.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/shared/merge.ts\">\u003ccode>src/shared/merge.ts\u003c/code>\u003c/a> · \u003ccode>mergeProblem\u003c/code>; \u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/main/services/task-merge.ts\">\u003ccode>src/main/services/task-merge.ts\u003c/code>\u003c/a>"
        ],
        [
         "Merge: fields",
         "Where both items have a different title, project, due date, asked by, waiting on, or priority set by hand, the user picks which to keep (the kept item's is picked first). A value always wins over an empty one.",
         "\u003ca class=\"src\" href=\"https://github.com/fcusano9/chief-of-staff/blob/main/src/shared/merge.ts\">\u003ccode>src/shared/merge.ts\u003c/code>\u003c/a> · \u003ccode>mergeFields\u003c/code>, \u003ccode>mergedInput\u003c/code>"
        ],
        [
         "Merge: combined",

// A plain-JavaScript copy of the priority score in src/shared/priority.ts and effectivePriority in
// src/shared/types.ts. tests/docs.test.ts checks it gives the same answers as the app.
var PriorityCalc = (function () {
  var DUE_HORIZON_DAYS = 14
  var STALE_HORIZON_DAYS = 14
  var FOLLOW_UP_BUSINESS_DAYS = 3
  var NO_SIGNALS = 'No deadline or urgency signals'
  var DAY_MS = 86400000

  function businessDaysSince(fromIso, now) {
    var from = new Date(fromIso)
    var day = new Date(from.getFullYear(), from.getMonth(), from.getDate() + 1)
    var end = new Date(now.getFullYear(), now.getMonth(), now.getDate())
    var n = 0
    for (; day <= end; day.setDate(day.getDate() + 1)) if (day.getDay() !== 0 && day.getDay() !== 6) n++
    return n
  }
  function needsFollowUp(t, now) {
    return t.status === 'waiting_on' && !!t.waitingSince && businessDaysSince(t.waitingSince, now) >= FOLLOW_UP_BUSINESS_DAYS
  }
  function daysUntil(date, now) {
    var p = date.split('-').map(Number)
    var due = Date.UTC(p[0], p[1] - 1, p[2])
    var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())
    return Math.round((due - today) / DAY_MS)
  }
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)) }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's') }

  // The three signals (each 0 to 1) and the reasons, before weighting.
  function parts(item, now) {
    var reasons = []
    var due = 0.2
    if (item.dueDate) {
      var days = daysUntil(item.dueDate, now)
      if (days < 0) {
        due = 1
        reasons.push({ impact: 1, text: 'overdue by ' + plural(-days, 'day') })
      } else if (days === 0) {
        due = 0.95
        reasons.push({ impact: 0.95, text: 'due today' })
      } else {
        due = Math.max(0, 1 - days / DUE_HORIZON_DAYS)
        if (due > 0) reasons.push({ impact: due, text: days === 1 ? 'due tomorrow' : 'due in ' + days + ' days' })
      }
    }
    var requester = 0.3
    if (item.requester) {
      requester = (clamp(item.requester.priorityWeight, 1, 5) - 1) / 4
      if (item.requester.priorityWeight >= 4) reasons.push({ impact: requester, text: 'requested by ' + item.requester.name })
    }
    var idleDays = Math.max(0, (now.getTime() - Date.parse(item.lastActivityAt)) / DAY_MS)
    var stale = Math.min(1, idleDays / STALE_HORIZON_DAYS + item.followUpCount * 0.25)
    if (item.followUpCount > 0) reasons.push({ impact: stale, text: plural(item.followUpCount, 'follow-up') })
    else if (idleDays >= 7) reasons.push({ impact: stale, text: 'no activity for ' + Math.round(idleDays) + ' days' })
    if (needsFollowUp(item, now)) {
      var bd = businessDaysSince(item.waitingSince, now)
      stale = Math.max(stale, Math.min(1, 0.6 + (bd - FOLLOW_UP_BUSINESS_DAYS) * 0.1))

    var tab = i < 0 ? h : h.slice(0, i), item = i < 0 ? '' : h.slice(i + 1)
    var known = TABS.filter(function (t) { return t[0] === tab })[0]
    return known ? { tab: known[0], item: item } : { tab: 'overview', item: '' }
  }
  function go(tab, item) {
    var h = '#' + tab + (item ? '-' + item : '')
    here = h
    var changed = false
    try { if (location.hash !== h) { location.hash = h; changed = location.hash === h } } catch (e) { /* address can't change */ }
    if (!changed) route()
  }
  // In-page links go through go(), so they work even where the address can't change.
  document.addEventListener('click', function (ev) {
    var ext = ev.target.closest('a[href^="http"]')
    if (ext) { ext.target = '_blank'; ext.rel = 'noopener'; return }
    var a = ev.target.closest('a[href^="#"]')
    if (!a || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return
    ev.preventDefault()
    var h = a.getAttribute('href').slice(1), i = h.indexOf('-')
    go(i < 0 ? h : h.slice(0, i), i < 0 ? '' : h.slice(i + 1))
  })
  function route() {
    var r = parseHash()
    TABS.forEach(function (t) {
      $('#v-' + t[0]).hidden = t[0] !== r.tab
      $('#tab-' + t[0]).setAttribute('aria-selected', String(t[0] === r.tab))
    })
    if (!rendered[r.tab]) { RENDER[r.tab](); rendered[r.tab] = true }
    if (r.tab !== current) { if (current) window.scrollTo(0, 0); current = r.tab; if (r.tab !== 'flows') stop() }
    if (SELECT[r.tab]) SELECT[r.tab](r.item)
    var tabEl = $('#tab-' + r.tab)
    if (tabEl && tabEl.scrollIntoView) tabEl.scrollIntoView({ block: 'nearest', inline: 'nearest' })
  }
  function setDev(on) {
    document.body.classList.toggle('dev', on)
    $('#mode-plain').setAttribute('aria-pressed', String(!on))
    $('#mode-dev').setAttribute('aria-pressed', String(on))
    store.set('cos-arch-dev', on ? '1' : '0')
  }
  var THEMES = [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']]
  function setTheme(t) {
    if (t === 'system') document.documentElement.removeAttribute('data-theme')
    else document.documentElement.setAttribute('data-theme', t)
    $('#theme').textContent = '◐ ' + THEMES.filter(function (x) { return x[0] === t })[0][1]
    store.set('cos-arch-theme', t)
  }

  $('#tabs').innerHTML = TABS.map(function (t) { return '<button class="tab" type="button" role="tab" id="tab-' + t[0] + '" aria-selected="false" data-tab="' + t[0] + '">' + t[1] + '</button>' }).join('')
  $('#tabs').addEventListener('click', function (ev) { var b = ev.target.closest('[data-tab]'); if (b) go(b.getAttribute('data-tab'), '') })
  $('#brand-ver').textContent = 'v' + F.version + ' · schema ' + F.schemaVersion
  $('#foot-facts').textContent = 'Built from the code: ' + F.channelCount + ' IPC calls · ' + F.tableCount + ' tables · schema version ' + F.schemaVersion
  $('#mode-plain').addEventListener('click', function () { setDev(false) })
  $('#mode-dev').addEventListener('click', function () { setDev(true) })
  $('#theme').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') || 'system'
    var i = THEMES.map(function (x) { return x[0] }).indexOf(cur)
    setTheme(THEMES[(i + 1) % THEMES.length][0])
  })
  $('#q').addEventListener('input', showResults)
  $('#q').addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault()
      if (!hits.length) return
      hitOn = (hitOn + (ev.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length
      Array.prototype.forEach.call(document.querySelectorAll('#results .result'), function (b, i) { b.classList.toggle('on', i === hitOn) })
    } else if (ev.key === 'Enter') { ev.preventDefault(); pick(hitOn) }
  })
  $('#results').addEventListener('click', function (ev) { var b = ev.target.closest('[data-i]'); if (b) pick(+b.getAttribute('data-i')) })
  document.addEventListener('click', function (ev) { if (!ev.target.closest('.search')) $('#results').hidden = true })
  document.addEventListener('keydown', function (ev) {
    var tag = document.activeElement && document.activeElement.tagName
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag || '')
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return
    if (ev.key === '/' && !typing) {
      ev.preventDefault()
      var local = current === 'rules' ? $('#rules-filter') : current === 'glossary' ? $('#terms-filter') : null
      ;(local || $('#q')).focus()
    } else if (ev.key === 'Escape') {
      $('#results').hidden = true
      if (typing) { document.activeElement.blur(); return }
      if (current === 'map' && mapSelected) go('map', '')
      if (current === 'data' && dataSelected) go('data', '')
    } else if (!typing && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
      var i = TABS.map(function (t) { return t[0] }).indexOf(current)
      var j = ev.key === 'ArrowLeft' ? i - 1 : i + 1
      if (j >= 0 && j < TABS.length) { ev.preventDefault(); go(TABS[j][0], ''); $('#tab-' + TABS[j][0]).focus() }
    } else if (!typing && current === 'flows' && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) {
      ev.preventDefault(); stop(); showStep(flowStep + (ev.key === 'ArrowDown' ? 1 : -1))
    }
  })
  window.addEventListener('hashchange', function () { here = location.hash; route() })

  setDev(store.get('cos-arch-dev') === '1')
  var savedTheme = store.get('cos-arch-theme')
  setTheme(savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'system')
  route()
})()
</script>
</html>
